var DEFAULT = "./html-CASM866491/ST575170.html";
function localHref(h){ if(!h) return ""; var i=h.indexOf("/sim/"); if(i<0) return h; return REL+h.substring(i+5); }
var REL = "./";
function render(){
  var el = document.getElementById("tree");
  el.innerHTML = "";
  var ul = document.createElement("ul");
  build(CAT, ul);
  el.appendChild(ul);
}
function filt(q){
  var el = document.getElementById("tree");
  el.innerHTML = "";
  var ul = document.createElement("ul");
  build(CAT, ul, q && q.toLowerCase());
  el.appendChild(ul);
  if(q) openAll(el);
}
function openAll(root){
  root.querySelectorAll("ul").forEach(function(u){ u.style.display="block"; });
  root.querySelectorAll(".ar").forEach(function(a){ a.textContent="−"; });
}
function build(node, parentUl, q){
  (node.children||[]).forEach(function(ch){
    var hasKids = ch.children && ch.children.length;
    var li = document.createElement("li");
    var match = !q || (ch.label||"").toLowerCase().indexOf(q)>=0;
    var childMatch = q && subtreeMatch(ch, q);
    if(!match && !childMatch) return;
    if(hasKids || (q && !ch.href && !hasKids)){
      var d = document.createElement("div");
      d.className = "dir";
      d.innerHTML = '<span class="ar">+</span>' + esc(ch.label||"");
      var sub = document.createElement("ul");
      sub.style.display = "none";
      d.onclick = function(){
        var open = sub.style.display === "none";
        sub.style.display = open ? "block" : "none";
        d.querySelector(".ar").textContent = open ? "−" : "+";
      };
      li.appendChild(d); li.appendChild(sub);
      parentUl.appendChild(li);
      build(ch, sub, q);
      if(q && subtreeMatch(ch,q)){ sub.style.display="block"; d.querySelector(".ar").textContent="−"; }
    } else if(ch.href){
      var p = document.createElement("div");
      p.className = "pg";
      p.textContent = ch.label || ch.href;
      p.dataset.href = localHref(ch.href);
      p.onclick = function(){ go(p); };
      li.appendChild(p);
      parentUl.appendChild(li);
    }
  });
}
function subtreeMatch(n,q){
  if((n.label||"").toLowerCase().indexOf(q)>=0) return true;
  return (n.children||[]).some(function(c){ return subtreeMatch(c,q); });
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  });
}
