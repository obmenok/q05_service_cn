         <h3 class="title topictitle1" title="ST576455">系统功能原理介绍</h3>
         
         
         <div class="body"> 
            
            <div class="section">
               <h3 class="title topictitle1">系统介绍</h3> 
               
               
            </div>
            
            
            <p class="p">前雨刮系统由刮水电动机和传动臂总成、雨刮臂总成、雨刮刷总成、刮臂孔盖组成。其中，刮水电动机和传动臂总成是由雨刮电机和传动臂组成，雨刮电机为永磁电机。刮水电动机和传动臂总成安装在暖风机压力室板总成上，雨刮臂和雨刮刷组装成雨刮臂及刮刷总成装配在刮水电动机和传动臂总成</p>  
            
            <p class="p">后雨刮系统由后雨刮电机、后雨刮臂、后雨刮刷组成。后雨刮电机安装在背门钣金上,后雨刮电机为永磁电机，与雨刮臂相连</p>  
            
            <p class="p">所有雨刮功能必须在整车上电后才有效。</p>  
            
            <p class="p">雨刮相关操作请参见 
               <a class="xref" href="ST576469.html">雨刮开关</a> 
               
            </p> 
            
         </div>
