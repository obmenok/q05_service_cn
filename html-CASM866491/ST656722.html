      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST656722">标定失败原因及排查</h3>
         
         
         <div class="body"> 
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>无法进入售后校准或进入后闪退；</p>  
                  
                  <p>原因：</p>  
                  
                  <p>a.诊断仪问题，重新启动诊断仪；</p>  
                  
                  <p>b.诊断仪上位机软件问题，需重新安装诊断仪软件，并升级为最新软件和固件。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>长时间不能校准完成；</p>  
                  
                  <p>原因：</p>  
                  
                  <p>a. 摄像头位置偏差过大，需检查摄像头是否安装到位；</p>  
                  
                  <p>b. 诊断仪运行过程中卡住，重新启动诊断仪和车辆，并按照上述标定方法重新开始标定；</p>  
                  
                  <p>c.车道线不清晰，或车道弯度大，导致无法识别到车道线，需更换车道线清晰的长直道路进行标定。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
