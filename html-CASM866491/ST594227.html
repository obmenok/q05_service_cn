      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST594227">BDC控制器安装方法</h3>
         
         
         <div class="body"> 
            
            <p class="p">车身智能控制器BDC（前域）位于左A立柱中内板。</p>  
            
            <p class="p">细节示意图：</p>  
            
            <p class="p"> 
               
               <div> 
                  
                  <div class="imagecenter"><img width="50%" src="image/MP420794.jpg" alt="MP420794"></img></div> 
                  
               </div> 
               
            </p>  
            
            <p class="p">安装步骤：</p>  
            
            <p class="p">注意需按照主次定位顺序紧固</p>  
            
            <p class="p">1、上安装孔①安装在车身钣金定位凸焊螺柱上；</p>  
            
            <p class="p">2、上安装孔①处装配标件六角法兰面螺母（09159-06010），扭力6±1N·m；</p>  
            
            <p class="p">3、下安装孔②处装配标件十字槽六角头螺钉（09128-06005-S112），扭力6±1N·m；</p>  
            
            <p class="p">4、下安装孔③处装配标件十字槽六角头螺钉（09128-06005-S112），扭力6±1N·m；</p>  
            
            <p class="p">5、将线束接插件母端与车身智能控制器总成插头对插，轻拔线束接插件应牢固，不能脱落。</p>  
            
            <p class="p">整车示意图：</p>  
            
            <p class="p"> 
               
               <div> 
                  
                  <div class="imagecenter"><img width="50%" src="image/MP420654.jpg" alt="MP420654"></img></div> 
                  
               </div> 
               
            </p> 
            
         </div>
