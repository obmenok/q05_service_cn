         <h3 class="title topictitle1" title="ST576311">检查与确认</h3>
         
         
         <div class="body"> 
            
            <p class="p">注意：诊断前，确认制动系统警告指示灯正常。</p>  
            
            <p class="p">1、证实顾客的问题。</p>  
            
            <p class="p">2、目视检查明显的机械、液压故障。</p>  
            
            <p class="p">目视检查项</p>  
            
            <p class="p">轮胎压力、车轮和轮胎 、制动液位、 制动管路泄露。</p>  
            
            <p class="p">3、在进行下一步检查之前先解决发现的问题。</p>  
            
            <p class="p">4、如果所观察或提出的问题的明显原因已经发现，则在进行下一个步骤之前，必须先将该原因修正。</p>  
            
            <p class="p">5、如果目视检查通过，则确认故障并参考故障症状表。</p>  
            
            <p class="p">通用设备</p>
