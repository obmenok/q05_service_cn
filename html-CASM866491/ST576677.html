      <section id="ST576677">
         
         
         
         <h3 class="title topictitle1" title="ST576677">拆卸和安装B柱外装饰件总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">1. 打开前后门，沿着箭头方向掀开B柱卡接密封条。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP363018.PNG" alt="MP363018"></img></div>  
            
            <p class="p">2. 用十字螺丝刀拆下2颗螺钉。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP363019.PNG" alt="MP363019"></img></div>  
            
            <p class="p">3. 将左侧的B柱外装饰件总成沿车外方向往外掰，即可拆下该B柱外装饰件总成。右侧的拆卸方式同左侧。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP363023.PNG" alt="MP363023"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装方式与拆卸方式相反。</p> 
            
         </div>
         
         
         
      </section>
