            <span class="ph b">安装</span>  
            
            <p class="p">1.在没有安装扰流板的时候将导航天线卡接在扰流板的安装结构里；</p>

            <p class="p">1.想办法拆掉扰流板总成</p>  
            
            <p class="p"> 
               
               <div>

            </p>

               </div>
