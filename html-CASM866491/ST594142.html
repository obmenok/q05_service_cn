      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST594142">转向系统转向间隙检查</h3>
         
         
         <div class="body"> 
            
            <p class="p">转向系统间隙是一直存在的，不能完全杜绝，即使新车也存在一定间隙，间隙值满足要求即可。 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>把汽车停在平整的地面，使车辆车轮处于直行状态。将整车下电，双手握紧方向盘，用力上下左右摇动方向盘（不要转动方向盘），检查是否有松旷现象；如果有松旷发生，检查转向柱、转向中间轴、转向器和方向盘是否松动；如转向柱、转向中间轴、转向器损坏且不能维修，则须进行更换；</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>把汽车停在平整的地面，使车辆车轮处于直行状态，用手轻微向右或向左转动方向盘至感觉有阻力时测量方向盘转动过的角度，要求转角≤6°</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p> 
            
         </div>
         
         
         
      </section>
