      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST594186">仪表上所有指示灯闪烁</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>观察仪表指示灯闪烁为单个指示灯闪烁还是多个指示灯同时闪烁</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>如果是多个指示灯同时闪烁的情况，通过诊断仪读取仪表故障码，看是否存在CAN BUSOFF相关故障码或者其他节点超时故障码，判断是否由整车CAN信号节点丢失或者CAN网络不稳定引起</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>如果是单个指示灯闪烁的情况，同样也需要使用诊断仪读取是否存在个别节点超时的故障码</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>如果不存在任何故障码，更换车机观察故障现象是否保持，如果现象保持，建议检查该指示灯对应的相关控制器是否存在故障；如果故障现象消失，将现场采集到的信息反馈给供应商，并将故障车机寄回供应商进行分析</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p> 
            
         </div>
         
         
         
      </section>
