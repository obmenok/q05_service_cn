         <h3 class="title topictitle1" title="ST576342">空调采暖系统</h3>
         
         
         <div class="body"> 
            
            <p class="p">纯电模式采暖系统</p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>利用高压电给风暖电加热器进行通电，电流流过电阻产生热量；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>热量累积在风暖电加热器芯体的陶瓷加热片上，风暖电加热器芯体就会变热；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>冷空气流过变暖的风暖电加热器芯体，变成热空气进入乘员舱，乘员舱以此进行采暖。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
