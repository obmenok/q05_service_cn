         <h3 class="title topictitle1" title="ST702949">标定失败要求及排查</h3>
         
         
         <div class="body"> 
            
            <p class="p">1.行驶状态问题：车速过快过慢、转弯过多</p>  
            
            <p class="p">2.有效数据采集不足，确保行驶时长足够</p>  
            
            <p class="p">3.标定场景不当：干扰车辆过多、场景无足够有效要素</p>  
            
            <p class="p">4.信号差：天气影响、非露天环境有遮挡</p>
