   <body onload="custTopic()">
      <section id="ST576409">
         
         
         
         <h3 class="title topictitle1" title="ST576409">冷却液泄漏检查</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>检查各回路蓄水瓶中冷却液液位。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>将测试仪安装到蓄水瓶的加注口。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>利用测试仪施加压力，使压力达到 160 kPa。 
                        
                        <div>
                           <div class="wl-attention prespace postspace" data-attention-type="caution" id="d57252e32">
                              <header>
                                 <h2>注意</h2>
                              </header>
                              <div class="attention-text postspace-s wl-attention-content">检查时确保在冷机状态，散热水箱内部压力勿必超过200kpa 否则会造成损坏。</div>
                           </div>
                           
                        </div> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>观察测试仪压力变化、各管路接头和散热器芯体等是否漏防冻液。</p> 
                     
                  </li> 
                  
               </ol> 标准：达到160kPa压力时，保压2min，压力无变化，各管路接头和散热器芯体无漏水。如果压力表指针所指的压力降低，则这可能表示存在漏水现象。维修或更换相应的零件。
               
            </p> 
            
         </div>
         
         
         
      </section>
