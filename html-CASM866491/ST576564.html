   <body onload="custTopic()">
      <section id="ST576564">
         
         
         
         <h3 class="title topictitle1" title="ST576564">驾驶员正面安全气囊</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>将车辆置于静止下电状态。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>将平口螺丝刀插入方向盘底罩侧边5、7点钟的拆卸孔内，直至顶住气囊卡接钢丝，然后用力往里桶，将气囊卡脚全部从卡接钢丝中释放出来。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP365294.jpg" alt="P245091"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>取下喇叭插接件</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP365303.jpg" alt="MP365303"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>取下多功能按键插接件</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP365304.jpg" alt="MP365304"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>平口螺丝刀撬起二级卡子,取下气囊的接插件。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/P245092.jpg" alt="P245092"></img></div> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>插上驾驶员正面安全气囊接插件。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>插上喇叭插接件</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>插上多功能按键插接件</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>将驾驶员正面安全气囊的三个卡脚对准方向盘内的三个安装孔，用力按下。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP365305.jpg" alt="P245094"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>晃动驾驶员正面安全气囊检查安装到位，并检查周边间隙是否均匀。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
