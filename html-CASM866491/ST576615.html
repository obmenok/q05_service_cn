      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576615">外观检查表</h3>
         
         
         <div class="body"> 
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               <thead style="font-weight: bold"> 
                  
                  <tr> 
                     
                     <th width="100%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>1、玻璃升降器金属件电镀层或化学处理层应均匀，表面不得存在缺镀、裂纹、锈蚀、划伤、变形等缺陷。</p> 
                        
                     </th> 
                     
                  </tr> 
                  
               </thead>  
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="100%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>玻璃升降器塑料件表面应平整、无气泡，无明显影响使用的变形。</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="100%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>商标、图案（零件标识等）字符，应清晰、完整。</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="100%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>钢丝绳、滑块等各摩擦部位应均匀涂润滑脂，润滑脂涂抹位置与用量必须满足图纸要求，润滑脂的选用型号，需通过长安公司产品部门认可。</p> 
                        
                     </td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
         </div>
