   <body onload="custTopic()">
      <section id="ST576671">
         
         
         
         <h3 class="title topictitle1" title="ST576671">充电口外盖总成</h3>
         
         
         <div class="body"> 
            <span class="ph b">拆卸</span>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>在充电口打开状态下，拆卸充电口外盖总成时，需使用细一字螺丝刀工具，先将一字起头部插入充电口外盖总成背面的限位缝隙处，再用一字起将限位块撬起张开一定角度，此时再沿箭头方向滑动充电口外盖总成，就可以将充电口外盖总成从充电口盖固定盒总成的铰链上取下。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP421593.jpeg" alt="MP421593"></img></div> 
                  
               </li> 
               
            </ol>  
            
            <ol class="num"> 
               
               <li> 
                  <span class="ph b">安装</span>  
                  
                  <p>安装大体以倒序进行，不需要使用工具，将充电口外盖总成与充电口盖固定盒总成铰链上的限位结构对齐后直接推进去卡接到位即可。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
