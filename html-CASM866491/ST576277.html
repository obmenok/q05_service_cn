         <h3 class="title topictitle1" title="ST576277">制动摩擦片更换</h3>
         
         
         <div class="body"> 
            
            <p class="p">摩擦片自带报警装置，使用到最小厚度时（前片为2mm，后片为2mm），制动时会出现“咳咳”声音。此时必须更换摩擦片。</p>  
            
            <p class="p">前摩擦片更换。 参考： 
               <a class="xref" href="ST576287.html">前制动摩擦块</a> 
               
            </p>  
            
            <p class="p">后摩擦片更换。 参考： 
               <a class="xref" href="ST576291.html">后制动摩擦块</a> 
               
            </p> 
            
         </div>
