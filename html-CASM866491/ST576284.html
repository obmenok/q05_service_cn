      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576284">制动疲软</h3>
         
         
         <div class="body"> 
            
            <p class="p">车辆抱怨制动疲软问题，请按如下方法进行检查</p>  
            
            <p class="p">1.踏板模式确认：通过车机屏幕将踏板模式调至100%，确认是否仍感觉疲软。</p>  
            
            <p class="p">2.读取故障码：使用诊断仪检查制动系统是否存在故障码，如有则按提示维修。</p>  
            
            <p class="p">3.检查液压系统泄露：检查制动主缸、卡钳、软管等是否存在泄漏或破损，必要时修复泄漏并重新加注排气。</p>  
            
            <p class="p">4.检查液压系统有空气：检查液压系统是否存在空气，进行制动系统排气确认。</p>  
            
            <p class="p">参考 
               <a class="xref" href="ST576280.html">制动系统排气</a> 
               
            </p>  
            
            <p class="p">5.检查摩擦片：如存在过度磨损，及时更换</p>  
            
            <p class="p">参考 
               <a class="xref" href="ST576277.html">制动摩擦片更换</a> 
               
            </p>  
            
            <p class="p">6.刹车油检查：确认液位是否正常，检查油液中是否有杂质或水分，必要时添加或更换。</p> 
            
         </div>
