   <body onload="custTopic()">
      <section id="ST605898">
         
         
         
         <h3 class="title topictitle1" title="ST605898">拆卸和安装前后门框外装饰板总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸门框外装饰板</span> 
               
            </p>  
            
            <p class="p">拆下前后门的窗框装饰亮条，参见 
               <a class="xref" href="ST576681.html">拆卸和安装侧围窗框装饰亮条总成</a>和 。
               
            </p>  
            
            <p class="p"> 
               <img src="image/MP424608.png"></img>  
               
               <div> 
                  
                  <h3 class="title topictitle1"></h3> 
                  
               </div> 
               
            </p>  
            
            <p class="p">用内六花螺丝刀拆下1颗螺钉，将左侧的前门框外装饰件沿箭头方向往上滑动，即可拆下该前门框外装饰件。右侧的拆卸方式同左侧。</p>  
            
            <p class="p">用内六花螺丝刀拆下1颗螺钉，将左侧的后门框外装饰件沿箭头方向往上滑动，即可拆下该后门框外装饰件。右侧的拆卸方式同左侧。</p>  
            
            <p class="p"> 
               
               <div> 
                  
                  <h3 class="title topictitle1"></h3>  
                  
                  <div class="imagecenter"><img width="50%" src="image/MP424609.png" alt="MP424609"></img></div> 
                  
               </div> 
               
            </p>  
            
            <p class="p">用内六花螺丝刀拆下2颗螺钉，将左侧的后门框外装饰件沿箭头方向往上滑动，即可拆下该后门框后外饰件。右侧的拆卸方式同左侧。</p>  
            
            <p class="p"> 
               
               <div> 
                  
                  <h3 class="title topictitle1"></h3>  
                  
                  <div class="imagecenter"><img width="50%" src="image/MP424610.png" alt="MP424610"></img></div> 
                  
               </div> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">安装门框外装饰板</span> 
               
            </p>  
            
            <p class="p">安装方式与拆卸方式相反。</p> 
            
         </div>
         
         
         
      </section>
