         <h3 class="title topictitle1" title="ST576344">车内温度传感器</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               
               <div> 
                  
                  <h3 class="title topictitle1"></h3>  
                  
                  <div class="imagecenter"><img width="50%" src="image/MP256973.jpg" alt="P131283"></img></div> 
                  
               </div> 
               
            </p>  
            
            <p class="p">用于检测车内温度，一端连接到暖通空调总成，另一端连接到仪表台内饰板，当空调鼓风机运作时，利用暖通空调通过仪表台内饰板格栅吸风，以检测车内的气流温度，两个端子之间的电阻值随温度的升高而降低，随环境温度降低而升高。</p>  
            
            <p class="p">常温状态下（环境温度10~25℃）电阻值范围：4.2 KΩ ~ 2.1 KΩ</p> 
            
         </div>
