      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576711">防锈处理</h3>
         
         
         <div class="body"> 
            
            <ul name="contents" class="ul"> 
               
               <li> 
                  
                  <p>防锈处理（涂装前）：</p>  
                  
                  <ol class="num"> 
                     
                     <li> 
                        
                        <p>使用气（电）动密封胶枪涂抹车身密封胶是一种防水和抗腐蚀措施，需在车门、发动机盖钢板接缝和摺边部位涂抹车身密封胶；</p>  
                        
                        <div style="margin-left:-20px;" class="imagecenterlevel2"><img width="50%" src="image/P244413.jpg" alt="P244413"></img></div> 
                        
                     </li>  
                     
                     <li> 
                        
                        <p>为了防止腐蚀，避免车身钢板因飞石撞击而损伤，车身底部和轮罩内侧需涂抹较厚的抗碎石涂料。</p>  
                        
                        <div style="margin-left:-20px;" class="imagecenterlevel2"><img width="50%" src="image/P244414.jpg" alt="P244414"></img></div> 
                        
                     </li> 
                     
                  </ol> 
                  
               </li>  
               
               <li> 
                  
                  <p>防锈处理（涂装后）：</p>  
                  
                  <ul name="contents" class="ul"> 
                     
                     <li> 
                        
                        <p>为防止涂装部位受到腐蚀，在侧车门、发动机盖、背门行李箱摺边内侧以及铰链、车柱等型断面的焊接部位，需涂抹足够的防锈剂（蜡）。</p>  
                        
                        <div style="margin-left:-20px;" class="imagecenterlevel2"><img width="50%" src="image/P244415.jpg" alt="P244415"></img></div> 
                        
                     </li> 
                     
                  </ul>
                  
                  
               </li>  
               
               <li> 
                  
                  <p>通过涂装进行防锈处理：</p>  
                  
                  <ul name="contents" class="ul"> 
                     
                     <li> 
                        
                        <p>为避免腐蚀，保护车身不受路面飞石撞击损伤，需在车身底部和轮罩内侧等部位喷涂抗碎石涂料。</p> 
                        
                     </li> 
                     
                  </ul>
                  
                  
               </li> 
               
            </ul>
            
            
         </div>
