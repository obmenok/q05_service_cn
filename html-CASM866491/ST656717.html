      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST656717">仪表提示摄像头被遮挡</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">故障现象</span> 
               
            </p>  
            
            <p class="p">仪表提示摄像头被遮挡故障，车道偏离故障灯为黄色。</p>  
            
            <p class="p"> 
               <span class="ph b">故障原因</span> 
               
            </p>  
            
            <p class="p">1.前视摄像头总成视野处被异物遮挡。</p>  
            
            <p class="p">2.前视摄像头总成视野处的玻璃破裂。</p>  
            
            <p class="p">3.前视摄像头总成的摄像头有灰尘。</p>  
            
            <p class="p"> 
               <span class="ph b">解决措施</span> 
               
            </p>  
            
            <p class="p">1.清理前挡风玻璃。</p>  
            
            <p class="p">2.更换前挡风玻璃。</p>  
            
            <p class="p">3.清理镜头。</p> 
            
         </div>
         
         
         
      </section>
