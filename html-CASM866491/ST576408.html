   <body onload="custTopic()">
      <section id="ST576408">
         
         
         
         <h3 class="title topictitle1" title="ST576408">冷却液液位检查</h3>
         
         
         <div class="body"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d57212e12">
                  <header>
                     <h2>危险</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">为避免烫伤的危险，在冷却液“ 沸腾” 时，不能打开蓄水瓶盖。</div>
               </div>
               
            </div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d57212e15">
                  <header>
                     <h2>危险</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">为避免烫伤的危险，当车辆运行时和散热器都还热时，不能打开蓄水瓶盖。</div>
               </div>
               
            </div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d57212e18">
                  <header>
                     <h2>危险</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">沸腾的液体和蒸气可能由于蓄水瓶盖打开得太早而在压力的作用下喷出。</div>
               </div>
               
            </div>  
            
            <p class="p">在车辆冷却时，拆除前舱装饰件，检查①低温蓄水瓶冷却液液位。正常的冷却液液位应处于蓄水瓶“MAX” 和“MIN” 标志之间。当冷却液液位低于“MIN” 标志时及时补充冷却液，并检查回路。附图为示意图。 
               <a class="xref" href="ST580727.html">拆卸和安装机舱饰件</a> 
               
            </p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP421546.jpg" alt="MP303845"></img></div> 
            
         </div>
