         <h3 class="title topictitle1" title="ST576356">冷凝器总成</h3>
         
         
         <div class="body"> 
            
            <div class="imagecenter"><img width="50%" src="image/MP359129.png" alt="MP324355"></img></div>  
            
            <p class="p">从空调压缩机出来的高压高温制冷剂蒸汽流入冷凝器，冷凝器由允许高压高温制冷剂蒸汽进行快速热传递的铝管和冷却翅片制成，冷却翅片通过散热把高压高温制冷剂蒸汽凝结成高压中温液体。</p>  
            
            <p class="p">储液干燥瓶位于冷凝器的右侧，储液干燥瓶内部结构设计可以保证高压高温的气液混和制冷剂进入，而从储液干燥瓶出来的只能是高压中温的液态制冷剂。储液干燥瓶内部有吸附制冷系统水分的干燥剂，干燥剂不能重复使用。</p> 
            
         </div>
