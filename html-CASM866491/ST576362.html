      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576362">R134a制冷剂使用说明</h3>
         
         
         <div class="body"> 
            
            <p class="p">制冷剂在空调系统中有如下作用：</p>  
            
            <p class="p">吸收热量</p>  
            
            <p class="p">携带热量</p>  
            
            <p class="p">释放热量</p>  
            
            <p class="p">车辆使用R-134a 制冷剂，制冷剂R-134a 为无毒、阻燃、透明、无色的液化气体。</p>  
            
            <p class="p">一定要遵照说明书中的步骤进行下列维修：</p>  
            
            <p class="p">1.制冷剂回收和再生</p>  
            
            <p class="p">2.添加冷冻油</p>  
            
            <p class="p">3.排空制冷系统</p>  
            
            <p class="p">4.重新加注制冷剂</p>  
            
            <p class="p">5.制冷剂注意事项：</p>  
            
            <p class="p">6.制冷剂不会燃烧或爆炸，但与明火接触时，会分解出对人体有害的气体，所以需要避开明火</p>  
            
            <p class="p">7.制冷剂在大气环境下会急剧蒸发，当其液体粘在皮肤上时，将从皮肤上大量吸热蒸发，导致局部冻伤，尽量避免接触皮肤。</p> 
            
         </div>
