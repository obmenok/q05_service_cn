         <h3 class="title topictitle1" title="TT576691">拆卸与安装遮阳板</h3>
         
         
         <div class="body"> 
            
            <p class="p">遮阳板拆卸：用一字螺丝刀将螺钉盖板打开，用十字螺丝刀拆下1颗螺钉；</p>  
            
            <p class="p">遮阳板固定座拆卸：将螺丝刀从固定座靠前挡玻璃侧的方孔插入，持续抵住固定座内的锁舌同时顺时针/逆时针旋转90°，缓慢拔下。</p>
