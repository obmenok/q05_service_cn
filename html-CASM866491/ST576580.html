      <section id="ST576580">
         
         
         
         <h3 class="title topictitle1" title="ST576580">拆卸和安装前门外开拉手</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d69605e18">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">这里介绍的是驾驶员侧车门外开拉手的拆卸和安装，其它三门外开拉手的拆卸和安装相同。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p">1.将前门玻璃升到顶</p>  
            
            <p class="p">2.拆卸前车门内饰板，参见 
               <a class="xref" href="ST576575.html">拆卸与安装前门内饰板</a> 
               
            </p>  
            
            <p class="p">3. 取下外开拉索</p>  
            
            <p class="p">将门锁的外开拉索按1、2依次从把手上取下，“箭头”指示处。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP414535.jpg" alt="MP414535"></img></div>  
            
            <p class="p">4. 取下箭头指示处的线束接插件</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP414528.jpg" alt="MP414528"></img></div>  
            
            <p class="p">5. 取下外开手柄</p>  
            
            <p class="p">将把手背后三颗螺丝拧松，便可取下把手，三颗螺丝位置，“箭头”指示处。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP414533.jpg" alt="MP414533"></img></div>  
            
            <p class="p">6、安装外开手柄</p>  
            
            <p class="p">更换新的外开手柄，安装时检查并调整外开手柄与车门外板间隙面差，然后将手柄背后三颗螺丝按7N*m的扭矩拧紧，三颗螺丝位置及安装顺序如下图“箭头”指示处。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP414534.jpg" alt="MP414534"></img></div> 
            
         </div>
