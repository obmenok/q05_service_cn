         <h3 class="title topictitle1" title="ST576554">前碰传感器</h3>
         
         
         <div class="body"> 
            
            <p class="p">前碰传感器（UFS）安装在前端框架上，左右各一个，是加速度传感器，在发生正面碰撞时候，能够感知碰撞信号，并将信号发给气囊控制器。</p>
