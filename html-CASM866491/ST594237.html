            <p class="p"> 
               <span class="ph b">关于此应用</span> 
               
            </p>  
            
            <p class="p">长安启源App是长安启源推出的汽车智能互联手机应用，为长安启源用户提供智慧出行服务。</p>  
            
            <p class="p">在使用该App时您可以：</p>  
            
            <p class="p">1.定位爱车位置，实时查询车辆状况。</p>  
            
            <p class="p">2.对车辆进行远程控制：如解闭锁、闪灯鸣笛寻找车辆，开关空调等。</p>  
            
            <p class="p">3.查看驾车数据及报告。</p>  
            
            <p class="p">4.通过电子围栏实现车辆监控。</p>  
            
            <p class="p">注：本应用需用户在购车时进行实名制注册并开通长安车联网服务，部分功能仅携带THU设备的车辆可用。</p>
