         <h3 class="title topictitle1" title="ST576313">电子驻车无响应</h3>
         
         
         <div class="body"> 
            
            <p class="p">1、检查接插件是否松动。</p>  
            
            <p class="p">2、使用诊断仪读取IBCU故障码。读取路径：诊断仪&gt;汽车诊断&gt;IBCU集成制动控制模块&gt;清读故障码&gt;读取当前故障码。故障码解析：
               <a class="xref" href="ST576315.html">电子驻车控制系统</a> 
               
            </p>  
            
            <p class="p">3、如需要更换电子驻车执行机构电机。参考： 
               <a class="xref" href="ST576316.html">后制动电机</a> 
               
            </p> 
            
         </div>
