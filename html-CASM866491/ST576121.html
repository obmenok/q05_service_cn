         <h3 class="title topictitle1" title="ST576121">整车高压上下电</h3>
         
         
         <div class="body"> 
            
            <p class="p">本车型基于各种用户场景，考虑整车状态及各控制器工作状态，发起高压上下电请求，动力电池（BMS）、电机控制器（PEU）等控制器按照约定的条件及顺序执行上下电动作，并反馈结果。</p>  
            
            <p class="p">高压零部件有：动力电池（BMS）、驱动电机、电机控制器（PEU）、充电机（OBC）、电动压缩机、PTC。</p>  
            
            <p class="p">因涉及高压电，需专业人员才能对高压线以及相关高压零件进行操作。</p>
