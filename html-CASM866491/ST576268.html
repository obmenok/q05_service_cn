   <body onload="custTopic()">
      <section id="ST576268">
         
         
         
         <h3 class="title topictitle1" title="ST576268">车轮和轮胎</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>取出行李箱工具盒中的螺母夹（序号1）</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP417820.png" alt="MP417820"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>使用螺母夹依次将车轮螺母装饰盖取下</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>逆时针拧松车轮固定螺母</p>  
                  
                  <p>扭矩：110±5N.m</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP417821.png" alt="MP417821"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>举升车辆</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆车轮固定螺母，取下车轮和轮胎</p>  
                  
                  <div>
                     <div class="wl-attention prespace postspace" data-attention-type="caution" id="d44821e58">
                        <header>
                           <h2>注意</h2>
                        </header>
                        <div class="attention-text postspace-s wl-attention-content"> 
                           
                           <ul name="contents" class="ul"> 
                              
                              <li> 
                                 
                                 <p>不要使用加热的方法来松动卡死的车轮螺母。加热可能损坏车轮和轮毂。</p>  
                                 
                                 <p>去除车轮、轮毂或制动盘安装面上的锈迹和灰尘。这些东西有可能导致车轮螺栓松动或汽车行驶时车轮松脱，不遵循以上说明可能导致人身伤害。</p> 
                                 
                              </li> 
                              
                           </ul>
                           
                           
                        </div>
                     </div>
                     
                  </div> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p>
