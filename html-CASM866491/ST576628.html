      <section id="ST576628">
         
         
         
         <h3 class="title topictitle1" title="ST576628">检查与确认</h3>
         
         
         <div class="body"> 
            
            <p class="p">1、检查顶盖玻璃总成与侧围面差，确认是否满足设计要求（天幕玻璃比侧围低）；</p>  
            
            <p class="p">2、运行顶盖遮阳帘，确认遮阳帘运行是否有异响、帘布起皱等；开启、关闭是否到位，关闭到位坐在后排前端遮阳帘与顶棚匹配是否漏光；开闭过程是否卡滞、抖动，防夹功能是否失效。</p> 
            
         </div>
         
         
         
      </section>
