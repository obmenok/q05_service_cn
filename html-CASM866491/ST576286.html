      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576286">前制动钳</h3>
         
         
         <div class="body"> 
            
            <p class="p">拆卸</p>  
            
            <p class="p">车辆熄火</p>  
            
            <p class="p">1、举升车辆。参考： 
               <a class="xref" href="ST575176.html">举升</a> 
               
            </p>  
            
            <p class="p">2、拆卸前轮。参考 ： 
               <a class="xref" href="ST576268.html">车轮和轮胎</a> 
               
            </p>  
            
            <p class="p">3、使用13#套筒拆卸前制动软管。扭力30±2N.m。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP380009.jpg" alt="MP298943"></img></div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d46800e39">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">封住制动软管防止油液流失和脏物进入。</div>
               </div>
               
            </div>  
            
            <p class="p">4、拆卸前卡钳总成，使用18#六角套筒，拆卸卡钳支架螺栓，扭力120±10N.m。如下图</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP380008.jpg" alt="P245972"></img></div>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p>  
            
            <p class="p">更换制动钳后，必须排气。 参考： 
               <a class="xref" href="ST576280.html">制动系统排气</a> 
               
            </p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d46800e59">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">制动钳支架安装螺栓需换新。</div>
               </div>
               
            </div> 
            
         </div>
