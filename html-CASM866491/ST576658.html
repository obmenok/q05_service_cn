            <div class="imagecenter"><img width="50%" src="image/MP431264.png" alt="MP361480"></img></div>  
            
            <div class="imagecenter"><img width="50%" src="image/MP431266.png" alt="MP361483"></img></div>  
            
            <p class="p">外后视镜的全部功能包含：镜片电动调节（1）、镜片电加热（2）、并线辅助提示灯（3）、电动折叠（4）、侧转向灯（5）、全景摄像头（6）。</p>  
            
            <p class="p">以上功能中，仅镜片电动调节（1）是全系车型都有。镜片电加热（2）、并线辅助提示灯（3）、电动折叠（4）、侧转向灯（5）、全景摄像头（6）不是全系标配，只匹配到某些配置车型上。</p>
