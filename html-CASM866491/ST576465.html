      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576465">雨刮不回位诊断流程</h3>
         
         
         <div class="body"> 
            
            <p class="p">雨刮电机不回位时， 按下表诊断流程来进行故障检查、判定和维修</p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               
               <tbody> 
                  
                  <tr align="center"> 
                     
                     <td width="50%" align="center" valign="&#xA;            top&#xA;          "> 
                        
                        <p>测试条件</p> 
                        
                     </td>  
                     
                     <td width="50%" align="center" valign="&#xA;            top&#xA;          "> 
                        
                        <p>细节/结果/措施</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>1、检查线束端连接雨刮电机的负极端口接地是否良好；</p> 
                        
                     </td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">&nbsp;</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">&nbsp;</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>→是，则执行步骤2；</p>  
                        
                        <p>→否，则连接雨刮电机的线束端接地不良；</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>2、检查雨刮电机停位端口与前域控制器之间的连接线束是否导通；</p> 
                        
                     </td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">&nbsp;</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">&nbsp;</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>→是，执行步骤3；</p>  
                        
                        <p>→否，则雨刮电机停位端口与前域控制器之间的连接线束短路；</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>检查雨刮电机停位端口是否周期性输出低电平（大约0V）；</p> 
                        
                     </td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>→是，则前域控制器存在故障；</p>  
                        
                        <p>→否,则雨刮电机存在故障;</p> 
                        
                     </td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
         </div>
         
         
         
      </section>
