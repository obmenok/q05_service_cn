      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST665129">前排座椅总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">前排座椅总成拆装</span> 
               
            </p>  
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>先将座椅移动到最前位置，使用棘轮扳手和11号套筒拆卸座椅后部固定螺栓。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP422217.jpg" alt="MP361516"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>再将座椅移动到最后位置，使用棘轮扳手和11号套筒拆卸座椅前部固定螺栓。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP422207.jpg" alt="MP361519"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>取下座椅底部线束连接插头，使用起子撬开车身线束固定在座椅上的卡子①和卡子②，取下前排座椅。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP439561.jpg" alt="MP294124"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>安装顺序与拆卸顺序相反。</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p> 
            
         </div>
