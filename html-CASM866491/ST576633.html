      <section id="ST576633">
         
         
         
         <h3 class="title topictitle1" title="ST576633">顶盖遮阳帘不能完全打开</h3>
         
         
         <div class="body"> 
            
            <p class="p">顶盖遮阳帘不能完全打开的主要原因为导轨内部有异物，导致机械组未运行到位。此时需对导轨内部进行检查并清洁。</p>  
            
            <p class="p">对未打开的位置的导轨段进行检查并清洁，清洁后先完全关闭遮阳帘，后再打开，如仍无法打开完毕，对遮阳帘进行初始化后再确认</p>  
            
            <p class="p">如初始化后仍无法解决需更换顶盖遮阳帘本体</p> 
            
         </div>
