      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576666">后视镜镜片不能调节</h3>
         
         
         <div class="body"> 
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>将前门内饰板从车上拆下。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>按压点2，将外后视镜主线束沿着箭头方向拔出。其中a对应外后视镜镜片的上下调节，b对应公共端，c对应外后视镜镜片的左右调节，将接插件上的线束a、b、c取出来，单独通12V电源检查镜片调节功能是否正常。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>若单独检查外后视镜镜片调节是正常的，则调节失效跟整车控制系统有关；若单独检查外后视镜镜片调节是不正常的，则更换外后视镜。</p> 
                  
               </li> 
               
            </ol>
