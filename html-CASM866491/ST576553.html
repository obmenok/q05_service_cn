      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576553">侧碰传感器</h3>
         
         
         <div class="body"> 
            
            <p class="p">侧碰传感器（PAS）安装在B柱下部，左右各一个，是加速度传感器，在发生侧面碰撞时候，能够感知碰撞信号，并将信号发给气囊控制器。</p>  
            
            <div class="imagecenter"><img width="" src="image/MP363430.svg" alt="P244140"></img></div>  
            
            <p class="p"></p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP363418.png" alt="P244736"></img></div>  
            
            <p class="p"></p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">

                  <tr>

                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">针脚定义（描述）</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">信号类型</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">信号范围</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">测试条件</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">备注</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">1</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">信号</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">/</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">/</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">点火开关on，对车身搭铁</td>  
                     
                     <td width="16.666666666666664%" valign="&#xA;            top&#xA;          ">由气囊控制器供电</td>

            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d66678e112">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">碰撞传感器的针脚有正负之分，针脚1为信号端，2为接地端，不能接反，否则气囊控制器无法完成自检。</p>
