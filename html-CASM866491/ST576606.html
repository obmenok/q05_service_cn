         <h3 class="title topictitle1" title="ST576606">拆卸和安装背门缓冲块</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">沿箭头方向旋出背门缓冲块。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP359299.jpg" alt="MP322793"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <ul name="contents" class="ul"> 
               
               <li> 
                  
                  <p>安装大体以倒序进行，安装完成后，进行背门缓冲块调整。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>沿箭头方向选择背门缓冲块（顺时针方向调整缓冲垫压缩量变小，逆时针方向缓冲垫压缩量变大），可以调整背门与车身的平齐度。</p> 
                  
               </li> 
               
            </ul>
            
            
            <div class="imagecenter"><img width="50%" src="image/MP359321.jpg" alt="MP322795"></img></div>
