      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST593854">检查与确认</h3>
         
         
         <div class="body"> 
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>确认顾客的问题。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>目视检查是否有明显的机械破坏痕迹。</p>  
                  
                  <p>目视检查表</p>  
                  
                  
                  <table width="100%" border="1" frame="box" rules="all">  
                     
                     
                     <tbody> 
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>轮胎气压（或气压表数值）</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>车轮与轮胎</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>车轮转向节</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>横拉杆球头</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>前副车架</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>前摆臂及摆臂球头销</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>前摆臂衬套及紧固件</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>前支柱总成</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>前横向稳定杆与前连接杆</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>后轴及衬套</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>后减振器总成</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>后螺旋弹簧与后弹簧上下垫</p> 
                              
                           </td> 
                           
                        </tr> 
                        
                     </tbody> 
                     
                  </table> 
                  
                  
               </li>  
               
               <li> 
                  
                  <p>如果观察或反应的问题很明显时，则执行下一步骤之前必须先排除故障。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>如果目视检查通过，则确认故障并参阅 
                     故障症状表 
                     
                  </p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
