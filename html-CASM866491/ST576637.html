      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576637">调整前罩总成</h3>
         
         
         <div class="body"> 
            
            <p class="p">旋转前罩缓冲垫①、②调节缓冲垫露出牙数，外露牙数2~4牙，对前罩焊接总成进行外观高差匹配调整。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP429684.jpg" alt="P243501"></img></div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d72495e18">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">缓冲垫调整到位之前，请勿大力关闭前罩，以防前罩边缘碰撞到前组合灯。</p>  
                     
                     <p class="p">如果前罩总成处于关闭状态时，周圈各处的间隙尺寸都是均匀的，没有向内凹或向外凸，且轮廓对齐，即说明前罩总成已正确调整好。</p>  
                     
                     <p class="p">调整过程应避免前罩铰链处伤漆，如果出现伤漆现象必须做补漆处理。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
