      <section id="ST594201">
         
         
         
         <h3 class="title topictitle1" title="ST594201">常见故障排查方法</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               
               
               <table width="100%" border="1" frame="box" rules="all">  
                  
                  
                  
                  
                  <tbody> 
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           <span class="ph b">症状</span> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           <span class="ph b">可能原因</span> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           <span class="ph b">维修方法</span> 
                           
                        </td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" rowspan="5" valign="&#xA;            top&#xA;          ">无声音</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">人为点击了静音</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">取消静音，调节音量至合适响度</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">扬声器故障</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">交换测试扬声器，如故障跟随扬声器走，则更换扬声器</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">主机与扬声器之间的线路故障</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">拆下接插件，用万用表量取线束端线路管脚是否有短路、开路情况，如锁定有故障，更换该线束。</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">外置功放总成故障</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">交换测试外置功放总成，如故障跟随功放走，更换该功放</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">主机故障</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">交换测试主机，如故障跟随主机走，更换该主机</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" rowspan="3" valign="&#xA;            top&#xA;          ">有杂音、破音</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">扬声器故障</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">检查扬声器外观，是否有外观破损等情况</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">外置功放总成故障</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">交换测试外置功放总成，如故障跟随功放走，更换该功放</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">主机故障</td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">交换测试主机，如故障跟随主机走，跟换该主机</td> 
                        
                     </tr> 
                     
                  </tbody> 
                  
               </table> 
               
               
            </p> 
            
         </div>
         
         
         
      </section>
