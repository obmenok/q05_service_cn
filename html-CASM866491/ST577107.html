      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST577107">标定要求</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">需要标定的情况：</span> 
               
            </p>  
            
            <p class="p"></p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>转向柱总成发生更换， 
                     <span class="ph b">必须</span>使用诊断设备（诊断仪等）对EPS系统进行下线配置；
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>转向系统零部件（方向盘、转向柱、转向器）发生更换，或转向柱中间轴与转向器连接处断开重新装配，或车辆由于其他原因重新做过四轮定位，则转角中位标定数据将丢失或不准确， 
                     <span class="ph b">必须</span>通过诊断设备（诊断仪等）对转角中位数据进行标定。
                     
                  </p>  
                  
                  <p>更换新的转向柱时，可直接通过诊断设备（诊断仪等）对转角中位数据进行标定；因其他原因，如拆装及其他动作导致转角中位变动、需要重新标定转角中位时，，需通过诊断设备（诊断仪等）对转向柱转角中位数据先进行清查，再重新进行标定；</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
