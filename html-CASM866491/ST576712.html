         <h3 class="title topictitle1" title="ST576712">结构钢板曲折变形必须予以更换</h3>
         
         
         <div class="body"> 
            
            <p class="p">一旦发现结构钢板有曲折变形现象，必须予以更换。</p>  
            
            <ul name="contents" class="ul"> 
               
               <li> 
                  
                  <p>EV：</p>  
                  
                  <div style="margin-left:-20px;" class="imagecenterlevel1"><img width="50%" src="image/MP430687.jpg" alt="P247402"></img></div> 
                  
               </li> 
               
            </ul>
            
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d75753e27">
                  <header>
                     <h2>警告</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">根据设计要求，结构钢板必须与原有设计外形一致。如果结构钢板在事故中变形，或者变形部分经修理重新使用，则这些钢板有可能无法满足与最初设计要求的安全性能。一旦发现有曲折的钢板，必须更换。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
