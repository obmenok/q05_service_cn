         <h3 class="title topictitle1" title="ST576527">氛围灯不亮</h3>
         
         
         <div class="body"> 
            
            <p class="p">确认氛围灯开关是否开启，打开后改变氛围灯颜色及亮度确认功能是否正常；</p>  
            
            <p class="p">确认氛围灯接插件安装到位，检查线束通讯及供电是否正常；</p>  
            
            <p class="p">确认LED或电路是否损坏，排查氛围灯短路，更换配件；</p>
