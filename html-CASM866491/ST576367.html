      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576367">制冷系统泄漏检查</h3>
         
         
         <div class="body"> 
            
            <p class="p">采用冷媒（R134a）泄漏检测设备，设置泄漏量为≤1.5g/年，各检漏部位检漏探头需停留2s以上，检漏仪探头在检漏部位处移动速度不高于2.5cm/s。</p>  
            
            <p class="p">检漏部位：电磁膨胀阀高低压进出口，电子膨胀阀高低压进出口，管路高低压加注口，低压管分段连接口，冷凝器高低压进出口，压缩机高低压进出口，储液罐进出口，动力电池冷媒连接板高低压接口，压力传感器连接口。</p> 
            
         </div>
         
         
         
      </section>
