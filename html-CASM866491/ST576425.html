      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576425">P挡按键显示异常</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">整车处于P挡时</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>检查此时换挡功能是否正常。若正常，跳转到步骤2；若不正常，跳转到步骤3。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>车辆静止时，退出P挡，按P挡按键，检查整车是否能进入P挡。若能进入P挡，跳转到步骤3,；若不能进入P挡，跳转到步骤4。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>P挡按键开关线束故障，更换线束，更换后确认故障是否消除。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>P挡开关故障，更换P挡开关，更换后确认故障是否消除。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
