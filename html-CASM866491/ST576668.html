   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576668">外后视镜总成（左）/（右）</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>拆卸前门内饰板，参见 
                        <a class="xref" href="ST576575.html">拆卸与安装前门内饰板</a> 。
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>按压点1、2，沿着箭头方向分别将外后视镜主线束、全景摄像头线束(部分车型有该配置)接插头拔出。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP432990.png" alt="MP361780"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>将堵头拔出，后将整个堵头及线束塞进钣金里面（橡胶堵头上有方向指示箭头，装配时需箭头朝上为正确状态，否则会有漏水问题）。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP432992.png" alt="MP361797"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>将红框内所示的螺母用套筒进行拆卸，将整个外后视镜取出。</p>  
                     
                     <div class="imagecenterlevel1"><img width="" src="image/MP432993.png" alt="P250260"></img></div> 
                     
                  </li> 
                  
               </ol> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p> 
            
         </div>
