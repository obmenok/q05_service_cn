   <body onload="custTopic()">
      <section id="ST576672">
         
         
         
         <h3 class="title topictitle1" title="ST576672">拆卸和安装充电口盖固定盒总成</h3>
         
         
         <div class="body"> 
            <span class="ph b">拆卸</span>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>打开充电口盖板；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>使用细一字螺丝刀工具，将位置1的4个拆卸工具孔凿穿，上部两个充电口盖固定盒总成的卡脚用一字起下压，下部两个充电口盖固定盒总成的卡脚用一字起上翘，同时用力将充电口盖固定盒总成拔出</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP421605.jpg" alt="MP421605"></img></div> 
                  
               </li> 
               
            </ol>  
            <span class="ph b">安装</span>  
            
            <p class="p">安装大体以倒序进行，不需要使用工具，将充电口盖固定盒总成铰链端塞入翼子板与充电插座之间，调整充电口盖固定盒总成与充电插座干涉的底部软胶，最后把充电口盖固定盒总成与翼子板上的限位结构对齐后推进去卡接到位即可，安装后依次按压4个拆卸工具孔，确保卡接到位，并调整充电口与翼子板间隙。</p> 
            
         </div>
         
         
         
      </section>
