   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576530">车内后顶灯</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">※天幕版后顶灯</span> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP419713.jpg" alt="MP419713"></img></div>  
            
            <div class="imagecenter"><img width="50%" src="image/MP419730.jpg" alt="MP419730"></img></div>  
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>拆卸后顶灯时，先把①安全拉手朝箭头方向拉开，再用十字螺丝刀取下2颗②螺钉，取下安全拉手总成。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拔下后顶灯线束接插件④，再用一字起将后顶灯③的卡扣（左右对称分布，共4个）取下，沿箭头方向取出后顶灯。</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p>  
            
            <p class="p"> 
               <span class="ph b">※非天幕版后顶灯</span> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP419734.jpg" alt="MP419734"></img></div>  
            
            <div class="imagecenter"><img width="50%" src="image/MP419736.jpg" alt="MP419736"></img></div>  
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>拆卸后顶灯时，用起子将顶灯前端的两个弹簧卡往车后推，顶灯前端弹出，将顶灯往车前移动，取下顶灯。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>将后顶灯线束连接器沿箭头方向取下。</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p> 
            
         </div>
