      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST594184">仪表黑屏</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>重启车机，观察是否恢复；如未恢复，断开蓄电池，观察能否恢复</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>确认仪表屏、车机的保险是否烧毁，查看表面是否有烧焦痕迹</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>确认线束是否松动导致接触不良，拆除仪表盖板和仪表螺钉后确认接插件是否扣合到位</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>如果线束和保险都无异常，万用表测量蓄电池电压。小于8.5V进入欠压保护或者大于17V进入过压保护，仪表都不会启动，表现为黑屏</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>以上无问题基本可以确认为单体存在问题，建议更换车机或者仪表屏</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p> 
            
         </div>
         
         
         
      </section>
