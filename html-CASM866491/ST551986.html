      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST551986">车门防撞梁不能单独维修</h3>
         
         
         <div class="body"> 
            
            <ul name="contents" class="ul"> 
               
               <li> 
                  
                  <p>车门防撞梁不能进行焊接作业；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>车门防撞梁不能进行拉拔等修复作业。</p> 
                  
               </li> 
               
            </ul>
            
            
            <div class="imagecenter"><img width="50%" src="image/MP425989.png" alt="P247404"></img></div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d28483e30">
                  <header>
                     <h2>警告</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <ul name="contents" class="ul"> 
                        
                        <li> 
                           
                           <p>车门防撞梁及其支架是非常重要的安全部件，当侧面受到撞击时，可以降低乘员受伤的可能性；</p> 
                           
                        </li>  
                        
                        <li> 
                           
                           <p>如果车门防撞梁及其支架受损，必须更换车门总成。</p> 
                           
                        </li> 
                        
                     </ul>
                     
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
