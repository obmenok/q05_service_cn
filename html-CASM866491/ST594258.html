      <section id="ST594258">
         
         
         
         <h3 class="title topictitle1" title="ST594258">常见故障排查方法</h3>
         
         
         <div class="body"> 
            
            <p class="p">单个摄像头绿屏、花屏、黑屏的问题，首先目视检查摄像头是否有明显的机械化电器损伤，摄像头本体是否损坏、进水，其次排查摄像头到车机端线束是否有松动，接插件是否插接到位。</p>  
            
            <p class="p">全景画面四个摄像头绿屏、花屏、黑屏，首先排查车机端四合一接插件是否松动，其次排查车机硬件是否出现故障。</p>  
            
            <p class="p">用万用表排查系统故障、用诊断仪读取故障码。</p> 
            
         </div>
