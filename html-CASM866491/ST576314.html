      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576314">电子驻车时异响</h3>
         
         
         <div class="body"> 
            
            <p class="p">1、使用诊断仪，进入：诊断仪&gt;汽车诊断&gt;IBCU集成制动控制模块&gt;特殊功能。</p>  
            
            <p class="p">2、操作“诊断释放两侧卡钳”。确认是否有异响。</p>  
            
            <p class="p">3、操作“诊断夹紧左后卡钳”，“诊断释放左后卡钳”。确认是否有异响。</p>  
            
            <p class="p">4、操作“诊断夹紧右后卡钳”，“诊断释放右后卡钳”。确认是否有异响。</p>  
            
            <p class="p">以上操作过程中出现异响，则更换出现异响的卡钳电机。 
               <a class="xref" href="ST576316.html">后制动电机</a> 
               
            </p> 
            
         </div>
         
         
         
      </section>
