      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576704">保护车身钢板邻近的部件</h3>
         
         
         <div class="body"> 
            
            <p class="p">使用不同类型的零部件固定在车身钢板上时，请注意下列事项，防止零部件和车身钢板损伤。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d75422e15">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <ul name="contents" class="ul"> 
                        
                        <li> 
                           
                           <p>修理车身钢板前，需拆下邻近的部件或使用保护罩将部件隔离保护；</p> 
                           
                        </li>  
                        
                        <li> 
                           
                           <p>使用螺丝刀或刮刀拆卸部件前，应将工具的尖锐部分用保护胶套缠绕起来，避免损伤部件和车身漆面；</p> 
                           
                        </li>  
                        
                        <li> 
                           
                           <p>拆卸车身外表面部件前，使用保护胶带粘贴车身，避免损伤漆面；</p> 
                           
                        </li>  
                        
                        <li> 
                           
                           <p>钻孔或切割某部位前，使用保护胶带粘贴车身，避免损伤漆面。</p> 
                           
                        </li> 
                        
                     </ul>
                     
                     
                  </div>
               </div>
               
            </div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d75422e45">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">点漆修补操作的漆面。</div>
               </div>
               
            </div> 
            
         </div>
