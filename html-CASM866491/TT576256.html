   <body onload="custTopic()">
      <section id="TT576256">
         
         
         
         <h3 class="title topictitle1" title="TT576256">前连接杆</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">1. 拆卸车轮。参考： 
               <a class="xref" href="ST576268.html">车轮和轮胎</a> 
               
            </p>  
            
            <p class="p">2. 举升车辆。</p>  
            
            <p class="p">3. 使用内止外动工装拆卸前稳定杆、前支柱与前连接杆螺母a。</p>  
            
            <p class="p">扭力：（120±10）N.m</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP330212.PNG" alt="MP330212"></img></div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d136122e37">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">拆卸时使用棉布保护球节以免损坏。拆卸螺母时，使用内止外动专用工具，固定球头销进行拆卸，禁止用工具卡住防尘罩侧或不固定球头销直接拆卸螺母，避免防尘罩和球头损伤。</div>
               </div>
               
            </div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d136122e49">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">安装前连接杆螺母时使用棉布保护球节以免损坏，使用内止外动专用工具固定前连接杆球头销进行安装，禁止用工具卡住防尘罩侧或不固定球头销直接安装螺母，避免防尘罩和球头损伤。</div>
               </div>
               
            </div> 
            
         </div>
         
         
         
      </section>
