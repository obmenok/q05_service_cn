      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576330">方向一边重一边轻</h3>
         
         
         <div class="body"> 
            
            <p class="p">1.将方向盘自然的摆在中间位置，用诊断仪读EPS左右力矩差，如力矩差超过0.5Nm，则说明是EPS内部扭矩传感器故障，更换转向柱总成。</p>  
            
            <p class="p">2.若步骤1检查无异常，则检查左右前轮轮胎气压是否存在明显差异、前悬零件是否有撞击变形、破损痕迹等异常；</p>  
            
            <p class="p">3.整车系统摩擦力是否一致，让车子通过举升机悬空，将整车下电，打动方向盘，检查方向盘左右力矩是否存在明显差异，若存在，进一步转动左右轮胎检查是否存在明显差异等，直到锁定故障原因后处理。</p> 
            
         </div>
         
         
         
      </section>
