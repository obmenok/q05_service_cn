      <section id="ST576681">
         
         
         
         <h3 class="title topictitle1" title="ST576681">拆卸和安装侧围窗框装饰亮条总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">1、打开前、后车门，拆卸和安装B柱外装饰件总成，参看 
               <a class="xref" href="ST576677.html">拆卸和安装B柱外装饰件总成</a> 。
               
            </p>  
            
            <p class="p">2、拔出图示箭头位置的的两颗卡扣，将前门窗框装饰亮条从两端缓慢拉出，直至完全取下。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP430332.jpg" alt="P299402"></img></div>  
            
            <p class="p">3、拔出图示箭头位置的的两颗卡扣，将后门窗框装饰亮条从两端缓慢拉出，直至完全取下。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP430351.jpg" alt="P302607"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">1、将前门窗框装饰亮条两端的卡扣搭在对应的卡槽上用于定位，按压亮条使其与上窗框完全贴合后将卡扣压入卡槽，完成装配。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP430360.jpg" alt="P302608"></img></div>  
            
            <p class="p">2、将后门窗框装饰亮条两端的卡扣搭在对应的卡槽上用于定位，按压亮条使其与上窗框完全贴合后将卡扣压入卡槽，完成装配。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP430400.jpg" alt="P302609"></img></div> 
            
         </div>
         
         
         
      </section>
