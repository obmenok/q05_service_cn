         <div class="body"> 
            
            <p class="p">请到各大手机应用市场搜索"长安启源”下载手机应用程序并完成安装，并在长安启源授权服务网点服务人员的帮助下，初始化账户信息并绑定车辆。</p>  
            
            <p class="p">绑定完成后，可对车辆进行远程车况查询或远程控制等操作。</p>
