         <h3 class="title topictitle1" title="ST576662">外观检查表</h3>
         
         
         <div class="body"> 
            
            <div class="imagecenter"><img width="50%" src="image/MP431255.png" alt="MP361766"></img></div>  
            
            <p class="p">外后视镜的镜盖（1）是星钻黑（喷涂），镜框（2）、镜壳（4）及镜座装饰件（5）是高光黑免喷涂，转向灯（3）是亚克力透明罩子。</p>  
            
            <p class="p">检查镜盖（1）外观漆面是否掉漆、划痕等缺陷。检查其余的外观是否存在划痕等缺陷。</p>
