         <h3 class="title topictitle1" title="ST576899">自动泊车传感器总成</h3>
         
         
         <div class="body"> 
            
            <p class="p">12颗超声波雷达传感器发射频率为44-60kHz的超声波信号，遇到障碍物时反射声波，探头传感器接收到反射的声波，并将信号数据传输到中央计算机，经中央计算机处理后，输出障碍物距离、轮廓、高低属性等信息，驾驶域控制器使用以上信息评估自车周围环境，实现自动泊车功能；车机接收到中央计算机传输的障碍物距离，用于产生声音和图像警示。
               
               <img src="image/MP397533.png"></img> 
               
            </p>
