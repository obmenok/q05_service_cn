      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST775601">环视标定失败原因及排查</h3>
         
         
         <div class="body"> 
            
            <ol class="num"></ol>  
            
            <p class="p">1、无法进入售后校准或进入后闪退；</p>  
            
            <p class="p">原因：</p>  
            
            <p class="p">a.售后静态app问题，重新进入app。</p>  
            
            <p class="p"></p>  
            
            <p class="p">2、长时间不能校准完成：</p>  
            
            <p class="p">原因：</p>  
            
            <p class="p">a.不满足校准要求，请根据静态标定app中的提示进行相应操作，主要条件参考周边环境标定条件、悬架模式等。 b.角度偏差过大，需通过目测先将传感器置于大致准确的位置，再重复校准。 c.摄像头安装支架损坏、金属支架变形，以及确认摄像头是否安装到位，导致摄像头无法紧固，需更换支架，用手晃动控制器，检查是否松动。
               d.在检查完后，需重启诊断仪软件，并重启车辆，再按上述标定方法进行操作。
            </p> 
            
         </div>
         
         
         
      </section>
