         <h3 class="title topictitle1" title="ST576415">冷却风扇总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>断开蓄电池负极线束。 
                     <a class="xref" href="ST576231.html">蓄电池总成</a> 
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拔出接插件。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP422801.png" alt="MP295258"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸风扇与散热器之间的2处固定螺栓。向上提出冷却风扇。扭矩：6±1 Nm。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP422802.png" alt="MP295259"></img></div> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d57571e58">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">拆装过程中禁止抓取冷却风扇扇叶，否则将导致风扇残余静不平衡超标，运行时噪声及振动过大。</div>
               </div>
