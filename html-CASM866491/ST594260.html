      <section id="ST594260">
         
         
         
         <h3 class="title topictitle1" title="ST594260">后摄像头</h3>
         
         
         <div class="body"> 
            
            <div class="imagecenter"><img width="50%" src="image/MP419339.png" alt="MP255674"></img></div>  
            
            <p class="p">1、全景后摄像头支架Ⅰ 2、全景后摄像头支架Ⅱ 3、摄像头支架后壳 4、后摄像头</p>  
            
            <p class="p">安装步骤：</p>  
            
            <p class="p">1、将摄像头放在全景后摄像头支架Ⅰ上，全景后摄像头支架Ⅱ卡接到支架Ⅰ上将摄像头固定，然后装上摄像头支架后壳卡接到支架Ⅰ，然后将装好的摄像头及支架卡接到后背门上</p>  
            
            <p class="p">2、连接线束接插件，并固定</p>  
            
            <p class="p">拆卸步骤：</p>  
            
            <p class="p">1、断开摄像头与车身端连接器；</p>  
            
            <p class="p">2、用平口螺丝刀轻轻撬开摄像头支架后壳和支架Ⅱ，取出摄像头本体；</p> 
            
         </div>
