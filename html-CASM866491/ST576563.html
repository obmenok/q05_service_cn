   <body onload="custTopic()">
      <section id="ST576563">
         
         
         
         <h3 class="title topictitle1" title="ST576563">安全气囊控制器</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>整体拆卸中控箱。参见 
                     <a class="xref" href="ST576688.html">拆卸与安装中控箱</a> 
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸气囊控制器安装螺栓。</p>  
                  
                  <p>扭矩：9±1.5Nm</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP410637.png" alt="P247466"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>拔掉气囊控制器接插件。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP410635.png" alt="P131752"></img></div> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d69163e61">
                  <header>
                     <h2>警告</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">安全气囊控制器必须轻拿轻放，装配时应注意避免磕碰、敲击、摔落。且不允许私自拆开控制器壳体。控制器紧固后，必须检查紧固螺栓的扭力值不低于9N•m。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d69163e68">
                  <header>
                     <h2>警告</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">所有安全气囊系统零件上的产品条形码为该零件唯一永久标识，在拆卸过程中不允许撕毁或污染，以便厂家对该零件进行质量追溯和性能检查。</p>  
                     
                     <p class="p">拆除中控箱之前，车辆下电，电源处于OFF档。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
         
         
         
      </section>
