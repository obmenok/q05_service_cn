         <h3 class="title topictitle1" title="ST576365">冷媒压力测试</h3>
         
         
         <div class="body"> 
            
            <p class="p">连接上空调压力检测表组，起动发动机，打开空调，温度设置最低，调整到内循环，测量空调系统高、低压压力。</p>  
            
            <p class="p"> 
               <span class="ph b">参考值（环境温度30℃以下）：</span> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">高压压力0.9 ~ 1.6 MPa</span> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">低压压力0.2 ~ 0.35 MPa</span> 
               
            </p>
