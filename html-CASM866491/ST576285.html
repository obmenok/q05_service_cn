         <h3 class="title topictitle1" title="ST576285">制动踏板不回位</h3>
         
         
         <div class="body"> 
            
            <ol class="num"> 
               
               <li>检查集成制动控制模块，参考： 
                  <a class="xref" href="ST576279.html">集成制动控制模块（IBCU）检查</a>。如果发现推杆弯曲或者总泵弹簧断裂，更换集成制动控制模块，操作方法参考： 
                  <a class="xref" href="ST576295.html">集成制动控制模块（IBCU）</a> 
                  
               </li>  
               
               <li> 
                  
                  <p>制动踏板检查，确认球笼处润滑是否良好。如果球笼处存在上述情况，涂抹润滑脂后多次重复试验，如果故障仍然存在，更换制动踏板。</p> 
                  
               </li> 
               
            </ol>
