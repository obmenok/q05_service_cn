      <section id="ST576483">
         
         
         
         <h3 class="title topictitle1" title="ST576483">系统功能原理介绍</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">自动雨刮</span> 
               
            </p>  
            
            <p class="p">前提：整车上电，雨刮模式设置为【auto】，且雨量环境光传感器无故障。</p>  
            
            <p class="p">雨量环境光传感器根据外界雨量的变化，输出相应雨刮刮刷请求输入给左前区域控制器,左前区域控制器控制雨刮动作，从而实现雨刮的自动刮刷。</p>  
            
            <p class="p"> 
               <span class="ph b">自动灯光</span> 
               
            </p>  
            
            <p class="p">前提：整车上电，且灯光模式设置为【auto】，且雨量环境光传感器无故障。</p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>近光、位置灯在以下情况立即点亮：雨量环境光传感器输出的灯光开关请求信号状态为打开。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>近光、位置灯在以下情况熄灭：雨量环境光传感器输出的灯光开关请求信号状态为关闭。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
