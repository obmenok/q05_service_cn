      <section id="ST576583">
         
         
         
         <h3 class="title topictitle1" title="ST576583">拆卸和安装前门车窗玻璃</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d69806e18">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">这里介绍的是左侧前车门玻璃的拆卸和安装，右侧前车门玻璃的拆卸和安装大体相同。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>拆卸前车门饰板 
                     <a class="xref" href="ST576575.html">拆卸与安装前门内饰板</a> 
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>取下密封薄膜（编号①指示处）和车门玻璃安装过孔防水堵盖（编号②指示处）。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP419338.jpg" alt="P299418"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>可以从过孔中看到前车门玻璃的两颗固定螺栓，如箭头所示位置，使用10号套筒拧松前车门玻璃固定螺栓。安装时螺栓拧紧力矩：9±1N.m。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP419343.jpg" alt="P248716"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>手握玻璃顶部，沿箭头方向取出前车门玻璃。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP419344.jpg" alt="P248717"></img></div> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装大体以拆卸倒序进行。需注意：玻璃安装后需要确保玻璃面差-1±1.5mm，以B柱盖板为测量基准。</p> 
            
         </div>
         
         
         
      </section>
