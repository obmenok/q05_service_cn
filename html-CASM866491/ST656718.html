      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST656718">报警时方向盘不震动</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">故障原因</span> 
               
            </p>  
            
            <p class="p">1、进入中控显示屏车辆中心→辅助驾驶→行车辅助界面，确认预警方式是否选择了声音提醒模式；若是，请选择振动模式或声音+振动模式。</p>  
            
            <p class="p">2、若提醒模式带振动，报警时方向盘仍不振动。需利用诊断仪KT710，排查系统是否存在当前故障：</p>  
            
            <p class="p">1）用诊断仪，进入B216前摄像头LAS，读取当前故障码，确认有无故障，如有故障，按DTC故障码相关排查方法进行排查。</p>  
            
            <p class="p">2）用诊断仪，进入B216 EPS，读取当前故障码，确认有无故障，如有故障，按DTC故障码相关排查方法进行排查。</p> 
            
         </div>
         
         
         
      </section>
