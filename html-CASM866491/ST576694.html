      <section id="ST576694">
         
         
         
         <h3 class="title topictitle1" title="ST576694">拆卸与安装A柱下装饰板总成</h3>
         
         
         <div class="body"> 
            
            <div class="section">
               <h3 class="title topictitle1">拆卸</h3> 
               
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>拆卸前门框密封胶条（左）， 参见 
                        <a class="xref" href="ST576581.html">拆卸和安装前门框密封条</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸前门槛装饰板（左）， 参见 
                        <a class="xref" href="ST576698.html">拆卸与安装前门槛装饰板总成</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>3.1用手向车后方向拆卸A柱下装内饰板总成（左），保证卡在钣金内的金属V型卡脱出；3.2用手向车内方向拆卸A柱下装内饰板总成（左），保证卡在钣金内的塑料卡扣脱出</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP424885.png" alt="MP321782"></img></div> 
                     
                  </li> 
                  
               </ol> 
               
            </div>
            
            
            <div class="section">
               <h3 class="title topictitle1">安装</h3> 
               
               
               <p class="p">安装顺序与拆卸顺序相反。</p>  
               
               <div>
                  <div class="wl-attention prespace postspace" data-attention-type="caution" id="d74906e58">
                     <header>
                        <h2>注意</h2>
                     </header>
                     <div class="attention-text postspace-s wl-attention-content">安装前，应对每个零件进行检查，看有无变质或损坏，如发现缺陷应更换，若金属V型卡拆卸时留在钣金孔上，安装时需从钣金取出卡接到零件上后再装配。右侧零件拆卸和安装参考左侧零件拆装方式。</div>
                  </div>
                  
               </div> 
               
            </div>
            
            
            <p class="p"></p>
