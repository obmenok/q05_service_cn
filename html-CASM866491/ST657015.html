      <section id="ST657015">
         
         
         
         <h3 class="title topictitle1" title="ST657015">显示屏黑屏</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">黑屏</span> 
               
            </p>  
            
            <p class="p">&nbsp;1、先检查是否有背光；</p>  
            
            <p class="p">&nbsp;2、若有背光，则尝试触摸屏幕是否有响应，若触控有响应，可以请域控制器进行问题排查；</p>  
            
            <p class="p">&nbsp;3、若无背光，检查车机屏的供电、视频线束连接是否正常；</p>  
            
            <p class="p">&nbsp;4、若以上均正常，则建议保持现象，等待专业工程师指导排查后进行拆件更换等；</p> 
            
         </div>
