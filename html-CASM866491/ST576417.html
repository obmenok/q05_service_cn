         <h3 class="title topictitle1" title="ST576417">散热器总成</h3>
         
         
         <div class="body"> 
            
            <div class="section"> 
               <span class="ph b">拆卸</span>  
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>断开蓄电池负极线束。 
                        <a class="xref" href="ST576231.html">蓄电池总成</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>回收制冷剂。 
                        <a class="xref" href="ST576364.html">回收与加注空调制冷剂</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>排空所有回路冷却液。 
                        <a class="xref" href="ST576410.html">冷却液液位排放加注</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸连接散热器总成的水管。使用一字起挑出水管快插接头卡环，拔出快插接头（图中红圈部位），完成水管拆卸。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP424061.jpg" alt="MP424061"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸散热器总成 
                        <a class="xref" href="ST576417.html">散热器总成</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>取下散热器总成。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP422501.png" alt="MP296078"></img></div> 
                     
                  </li> 
                  
               </ol> 
               
            </div>
            
            
            <div class="section"> 
               <span class="ph b">安装</span>  
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>安装顺序与拆卸顺序相反。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>安装完成后，对空调系统抽真空。 
                        <a class="xref" href="ST576364.html">回收与加注空调制冷剂</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li>

                     </p> 
                     
                  </li>

                     </p> 
                     
                  </li>
