      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576240">前摆臂球头检查</h3>
         
         
         <div class="body"> 
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>举升汽车，拆下前摆臂球头销。参考： 
                     <a class="xref" href="ST576252.html">前摆臂总成(衬套)</a> 
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>两手分别抓牢前摆臂球头销的球销端与壳体端，试图上下移动，观察有无移动。自由移动通常会伴随着喀哒声，出现自由移动则已损坏。如有自由移动，更换前摆臂球头销总成。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>将前摆臂球头销固定，用扭力扳手以每3至5秒一圈的速度连续转动球头销，读取第5圈的扭矩值。转动力矩：0.5~3.0N·m。如不在范围内，更换前摆臂球头销总成。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>更换前摆臂球头销总成后，应进行前轮定位。参考： 
                     前轮定位参数检查 
                     
                  </p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
