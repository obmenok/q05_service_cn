      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST575175">支撑</h3>
         
         
         <div class="body"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d29600e12">
                  <header>
                     <h2>警告</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">务必要将车辆停放于坚硬的平地上。如果要在软地上顶起车辆，则须在千斤顶下放置负荷分散块。务必要在顶起点的对角车轮位置的反方向放置挡块。不遵守这些说明，可能会造成个人伤害。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d29600e18">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">支撑前，关闭车轮自动回正功能，关闭路径为车机界面“驾驶-车轮自动回正”。</div>
               </div>
               
            </div>  
            
            <p class="p">当维修车辆需要使用千斤顶时，全面了解下列指导是至关重要的。必须确认正确的支撑点，支撑点通常选在前后轮之间开放的区域。使用千斤顶时，应用一个衬垫保护车漆不受损伤。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP437452.png" alt="MP380599"></img></div> 
            
         </div>
