   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST575176">举升</h3>
         
         
         <div class="body"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d29635e12">
                  <header>
                     <h2>警告</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">使用正确的举升位置，对于举升的安全性非常重要。否则可能会损坏车辆或者造成人身伤害。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d29635e18">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">在使用两柱式举升机举升车辆时，必须在举升位置下使用水平衬块；</p>  
                     
                     <p class="p">举升前，关闭车轮自动回正功能，关闭路径为车机界面“驾驶-车轮自动回正”。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <div class="imagecenter"><img width="50%" src="image/MP439134.png" alt="P130856"></img></div>  
            
            <p class="p">前举升区域：车身下护板举升标识处至车后方，对应车体钣金门槛缺口之间的下止口区域，左右对称。</p>  
            
            <p class="p">后举升区域：车身下护板举升标识处至车前方，对应车体钣金门槛缺口之间的下止口区域，左右对称。</p> 
            
         </div>
         
         
         
      </section>
