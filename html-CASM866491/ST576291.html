      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576291">后制动摩擦块</h3>
         
         
         <div class="body"> 
            
            <p class="p">拆卸</p>  
            
            <p class="p">1、拆卸后卡钳。参考 
               后制动钳 
               
            </p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d47182e22">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">忽略拆卸制动软管。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p">2、拆卸制动钳上轴销固定螺栓。扭矩：31-38N.m。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d47182e31">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">此螺栓为一次性使用件，不可重复使用。</div>
               </div>
               
            </div>  
            
            <div class="imagecenter"><img width="50%" src="image/P428632.JPG" alt="P245994"></img></div>  
            
            <p class="p">3、将制动钳钳体绕一轴翻转。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428633.JPG" alt="MP299252"></img></div>  
            
            <p class="p">4、拆卸制动器摩擦块。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428634.JPG" alt="MP299253"></img></div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d47182e50">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">拆卸制动块的时，禁止用力翻转制动卡钳钳体造成制动软管变形和EPB线束拉扯，必要时可拔掉EPB线束</div>
               </div>
               
            </div>  
            
            <p class="p">安装</p>  
            
            <p class="p">安装顺序与拆卸顺完全相反。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d47182e60">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">1、摩擦块换新时须成对更换（即内摩擦块和外摩擦块同时换新）</p>  
                     
                     <p class="p">2、换完后用力踩制动踏板两次以上，检查制动液位，必要时添加</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
         
         
         
      </section>
