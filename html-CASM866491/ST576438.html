         <h3 class="title topictitle1" title="ST576438">电源插座</h3>
         
         
         <div class="body"> 
            
            <div class="section">
               <h3 class="title topictitle1">拆卸</h3> 
               
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>整车下电，在前舱内断开蓄电池负极线束。</p> 请参见 
                     <a class="xref" href="ST576231.html">蓄电池总成</a> 章节。
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸点烟器面板及线束接插件，再取出电源插座。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP420000.jpg" alt="MP420000"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸后备箱左侧C立柱下内饰面板及线束接插件，再取出电源插座。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP422972.jpg" alt="MP422972"></img></div> 
                     
                  </li> 
                  
               </ol> 
               
            </div>
            
            
            <div class="section">
               <h3 class="title topictitle1">安装</h3> 
               
               
               <p class="p">安装顺序与拆卸顺序相反。</p>
