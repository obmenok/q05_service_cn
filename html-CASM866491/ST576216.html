      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576216">检查与确认</h3>
         
         
         <div class="body"> 
            
            <p class="p">一般检查</p>  
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>检查驱动轴防尘罩是否有明显的裂痕或破裂。</p>  
                     
                     <p>注意：检查驱动轴防尘罩，观察防尘罩的旋绕处是否有凹陷 (凹痕)。如果发现凹陷，则必须更换。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>检查驱动轴防尘罩外围及内侧部位周围是否有油脂泼溅痕迹，如果有，则可能是驱动轴防尘罩损坏漏脂或防尘罩固定夹箍损坏油脂。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>确认驱动轴锁紧螺母是正确的锁紧扭力。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>检查确认内侧等速万向节沿推力方向平稳滑动。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>检查确认外侧等速万向节间隙是否正常。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>如果检查之后问题仍然存在，则根据故障症状表进行排查。</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p> 
            
         </div>
         
         
         
      </section>
