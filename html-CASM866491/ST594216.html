         <div class="body"> 
            
            <p class="p">组成：由射频接收器总成RFBT、车身智能控制器总成前域BDC和、车身智能控制器总成后域BDCR组成。（BDCR集成RFBT，车辆含两个控制器其中之一，具体根据车辆配置确定）</p>  
            
            <p class="p">位置分布：</p>  
            
            <p class="p">1、射频接收器总成RFBT、车身智能控制器总成后域BDCR位于背门横梁；</p>  
            
            <p class="p">2、车身智能控制器总成前域BDC位于左A立柱中内板。</p>
