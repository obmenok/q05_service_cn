   <body onload="custTopic()">
      <section id="ST576604">
         
         
         
         <h3 class="title topictitle1" title="ST576604">拆卸和安装背门铰链</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>拆卸背门背门驱动机构撑杆总成，参见 
                     <a class="xref" href="ST580649.html">拆卸和安装背门驱动机构撑杆总成</a> ；
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>旋出背门铰链（背门侧）固定螺栓，工具：套筒（13），螺栓拧紧力矩 23±2.5N.m，拆卸背门；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸 C 柱上饰板总成，参见 
                     <a class="xref" href="ST576696.html">拆卸与安装C柱装饰板</a> ；
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>脱开顶棚后端固定卡扣，参见 
                     <a class="xref" href="ST576690.html">拆卸与安装顶盖内衬</a> ；
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>旋出背门铰链（顶盖侧）固定螺母，取出背门铰链①、②。工具：套筒（13），螺栓拧紧力矩 33±3N.m。</p> 
                  
               </li> 
               
            </ol>  
            
            <div class="imagecenter"><img width="50%" src="image/MP359257.jpg" alt="MP322789"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装大体以倒序进行，安装完成后，对背门进行调整。</p> 
            
         </div>
         
         
         
      </section>
