   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576459">雨刮片刮不净、抖动的现象</h3>
         
         
         <div class="body"> 
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p> 
                           <span class="ph b">常见故障</span> 
                           
                        </p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p> 
                           <span class="ph b">故障图示</span> 
                           
                        </p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p> 
                           <span class="ph b">可能原因</span> 
                           
                        </p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>细长的弧形条纹，影响视线。</p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <div class="imagetable"><img width="50%" src="image/P245258.jpg" alt="P245258"></img></div> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>雨刮皮胶条上有异物，或胶条刃口破损。</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>雨刮片发出异响、抖动，胶条不能顺利的反转，出现竖条纹。</p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <div class="imagetable"><img width="50%" src="image/P245261.jpg" alt="P245261"></img></div> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>玻璃上有油或者蜡，或者胶条变形或者刮臂不合格。</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>刮片刮过后，留下斑状水痕。</p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <div class="imagetable"><img width="50%" src="image/P245262.jpg" alt="P245262"></img></div> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>胶条变形或老化。</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>胶条没有贴合到玻璃表面，不能均匀刮刷，形成片状或带状区域。</p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <div class="imagetable"><img width="50%" src="image/P245263.jpg" alt="P245263"></img></div> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>胶条变形，或者刮片骨架变形，导致压力不足。</p> 
                        
                     </td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
         </div>
         
         
         
      </section>
