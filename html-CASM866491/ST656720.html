            <p class="p"> 
               <span class="ph b">需要标定的情况：</span> 
               
            </p>  
            
            <p class="p">1、更换LAS控制器；2、摄像头角度超出范围；3、支架损坏 ；4、更换前挡风玻璃；5、出现需要重新标定DTC故障码（B220A84:在线校准超差范围；B220A85：售后校准超出范围；B220A63：售后校准超时；B220A54：摄像头未校准）。</p>

               <span class="ph b">工具：</span>诊断仪
               
            </p>

            </p>
