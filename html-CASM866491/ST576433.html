      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576433">检查与确认</h3>
         
         
         <div class="body"> 
            
            <p class="p">1. 确认顾客的问题。</p>  
            
            <p class="p">2. 如果无线充电无法工作，首先需确认手机是否有无线充电功能和无线充电软开关是否打开,其次确定手机是否放在充电有效区域以及面板上是否有金属异物，最后确认手机是否带有较厚手机壳或手机壳是否携带金属。</p>  
            
            <p class="p">3. 拔下接插件，用万用表检查线束端是否有电供给无线充电。</p>  
            
            <p class="p">4.以上都正常，拆下换件处理。</p> 
            
         </div>
         
         
         
      </section>
