         <h3 class="title topictitle1" title="ST576460">雨刮维修模式</h3>
         
         
         <div class="body"> 
            
            <p class="p">车辆上电后，在中控显示屏上点击【车辆中心】-【安全维护】-【前雨刮维修模式】，功能开启，前雨刮片将移动并保持在维修位置方便维修人员对雨刮进行处理。再次点击，功能关闭，雨刮回到正常位置。</p>
