      <section id="ST576579">
         
         
         
         <h3 class="title topictitle1" title="ST576579">拆卸和安装前车门限位器</h3>
         
         
         <div class="body"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d69537e12">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">这里介绍的是左侧前车门限位器的拆卸和安装，右侧前车门限位器的拆卸和安装大体相同。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">工具</p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               
               <thead style="font-weight: bold"> 
                  
                  <tr> 
                     
                     <th width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>名称</p> 
                        
                     </th>  
                     
                     <th width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>数量</p> 
                        
                     </th> 
                     
                  </tr> 
                  
               </thead>  
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>10号套筒</p> 
                        
                     </td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>1</p> 
                        
                     </td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>拆卸前车门饰板，用手小心拆除下图示“箭头”指示处防水膜； 
                     <a class="xref" href="ST576575.html">拆卸与安装前门内饰板</a> 
                     
                  </p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP414221.jpg" alt="MP414221"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>使用10号套筒旋出前车门限位器（车门处）固定螺栓，“箭头”指示处；紧力矩：9±2N.m。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP414222.jpg" alt="MP414222"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>使用10号套筒旋出前车门限位器（侧围处）固定螺栓，“箭头”指示处；拧紧力矩：23±3N.m。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP414223.jpg" alt="MP414223"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>取出前车门限位器。</p> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装大体以拆卸倒序进行。</p> 
            
         </div>
         
         
         
      </section>
