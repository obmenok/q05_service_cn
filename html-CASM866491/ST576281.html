   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576281">检查与确认</h3>
         
         
         <div class="body"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d45998e12">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">诊断前，确认制动系统警告指示灯正常。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p"> 
               <span class="ph b">通用设备</span> 
               
            </p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="100%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>数字式万用表</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="100%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>诊断仪</p> 
                        
                     </td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
            <p class="p"> 
               <span class="ph b">步骤</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>证实顾客的问题。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>目视检查明显的机械、液压故障。</p>  
                  
                  <p>目视检查表（机械）</p>  
                  
                  
                  <table width="100%" border="1" frame="box" rules="all">  
                     
                     
                     <tbody> 
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>轮胎压力</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>车轮和轮胎</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>制动液位</p> 
                              
                           </td> 
                           
                        </tr>  
                        
                        <tr> 
                           
                           <td width="100%" valign="&#xA;            top&#xA;          "> 
                              
                              <p>制动管路泄露</p> 
                              
                           </td> 
                           
                        </tr> 
                        
                     </tbody> 
                     
                  </table> 
                  
                  
               </li>  
               
               <li> 
                  
                  <p>在进行下一步检查之前先解决发现的问题。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>如果所观察或提出的问题的明显原因已经发现，则在进行下一个步骤之前，必须先将该原因修正。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>如果目视检查通过，则确认故障并参考故障症状表。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
         
         
         
      </section>
