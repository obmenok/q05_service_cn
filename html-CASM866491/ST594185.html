         <h3 class="title topictitle1" title="ST594185">仪表花屏</h3>
         
         
         <div class="body"> 
            
            <p class="p">1.观察仪表花屏为整表花屏还是局部花屏</p>  
            
            <p class="p">2.如果现象为整表花屏，即切换到不同仪表界面均存在花屏故障，大概率是液晶屏故障，建议更换仪表屏并将仪表屏寄回供应商进行分析</p>  
            
            <p class="p">3.如果现象为局部花屏，即单一界面花屏，其它界面显示正常，为车机故障。将现场采集到的信息和故障车机寄回供应商进行分析</p> 
            
         </div>
         
         
         
      </section>
