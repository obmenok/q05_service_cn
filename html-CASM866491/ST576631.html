         <h3 class="title topictitle1" title="ST576631">顶盖遮阳帘异响</h3>
         
         
         <div class="body"> 
            
            <p class="p">顶盖遮阳帘运行时异响：</p>  
            
            <p class="p">先检查边条、帘布等是否有褶皱、脱落等，然后润滑、初始化无法解决后，用正常的电机替换检查是否是电机问题，如否则在异响时对遮阳帘机械组可接触位置及导轨涂抹润滑油脂，并反复运行几次保证充分润滑，如无法解决，需要更换顶盖遮阳帘本体。</p> 
            
         </div>
