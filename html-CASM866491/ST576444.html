         <h3 class="title topictitle1" title="ST576444">喇叭</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">功能</span> 
               
            </p>  
            
            <p class="p">喇叭：一般安装在前上构件或前端模块上，用来警示行人和其他车辆，以引起注意，保证行车安全。</p>  
            
            <p class="p"> 
               <span class="ph b">工作原理</span> 
               
            </p>  
            
            <p class="p">喇叭利用自身的机械结构（上、下触点臂结构），将直流电转换为脉冲电，然后通过电磁铁驱动内部膜片往复振动发出声音，并在螺旋形扬声筒声道中沿一定的规律扩展，在喇叭口处辐射发声。</p>  
            
            <p class="p"> 
               <span class="ph b">产品结构</span> 
               
            </p>  
            
            <p class="p">1.单体及结构</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P249119.jpg" alt="P249119"></img></div>  
            
            <p class="p">2.布置结构</p>  
            
            <p class="p">喇叭布置在前端框架侧面上。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP412600.jpg" alt="MP412600"></img></div>  
            
            <p class="p">3.接口定义</p>
