      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST594143">方向回正性检查</h3>
         
         
         <div class="body"> 
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>启动车辆，在平直道路上直线加速至30km/h。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>向左或向右旋转方向盘90°，松开方向盘。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>若方向盘流畅回转无卡滞，回正残余角度小于20°，车辆回正正常。</p> 
                  
               </li> 
               
            </ol>  
            
            <p class="p">建议：如果回正不良，按顺序检查各项：转向柱与转向器联接螺栓、轮胎气压、四轮定位参数、EPS中位标定、悬架系统相关部件。</p> 
            
         </div>
         
         
         
      </section>
