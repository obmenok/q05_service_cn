      <section id="ST576582">
         
         
         
         <h3 class="title topictitle1" title="ST576582">拆卸和安装前门密封条</h3>
         
         
         <div class="body"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d69743e12">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">这里介绍的是左侧前车门密封条的拆卸和安装，右侧前车门密封条的拆卸和安装大体相同。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">将限位器从车门上拆卸并保持车门位置，防止车门开度过大碰撞翼子板。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP419487.jpg" alt="P131310"></img></div>  
            
            <p class="p">沿箭头方向将前车门密封条与固定卡扣从车门中拉出</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP419491.jpg" alt="P131310"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装大体以拆卸倒序进行，同时注意下列事项：</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d69743e46">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">检查固定卡扣是否损坏，必要时更换。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
