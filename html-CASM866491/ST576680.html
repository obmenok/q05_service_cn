         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP424552.png" alt="MP424552"></img></div>  
            
            <p class="p">用塑料起子将徽标慢慢翘起取下，此过程易损伤漆面，请注意力度。</p>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP424554.png" alt="MP424554"></img></div>  
            
            <p class="p">用无尘布将需粘贴徽标位置擦拭干净；将徽标背胶贴纸撕掉后粘贴，持续按压5s保证粘贴牢靠。</p>
