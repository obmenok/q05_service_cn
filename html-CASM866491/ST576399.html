   <body onload="custTopic()">
      <section id="ST576399">
         
         
         
         <h3 class="title topictitle1" title="ST576399">冷却系统概述</h3>
         
         
         <div class="body"> 
            
            <div class="imagecenter"><img width="" src="image/MP442199.png" alt="P359379"></img></div>  
            
            <div class="imagecenter"><img width="" src="image/MP442202.png" alt="MP442202"></img></div>  
            
            <p class="p"> 
               <span class="ph b">电机冷却系统</span> 
               
            </p>  
            
            <p class="p">结构：有电子水泵、低温散热器、水管等零件组成；电驱串联在冷却回路里面，由电子水泵驱动水路循环，通过低温散热器与外界散热。</p>  
            
            <p class="p"> 
               <span class="ph b">动力电池冷却加热系统</span> 
               
            </p>  
            
            <p class="p">低配405Km续航</p>  
            
            <p class="p">电池冷却：冷媒通过电池冷板截流膨胀，电池冷板直接给电池进行冷却；电池加热：通过电池内加热膜进行加热。</p>  
            
            <p class="p">高配505Km续航</p>  
            
            <p class="p">电池冷却：冷媒通过冷却器降低冷却液温度，电池水泵使冷却回路运转，冷却液给电池冷却；电池加热：水电加热器提升冷却液温度，给电池加热</p> 
            
         </div>
         
         
         
      </section>
