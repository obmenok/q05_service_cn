   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST594181">外观检查表</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               
               
               <table width="100%" border="1" frame="box" rules="all">  
                  
                  
                  
                  <tbody> 
                     
                     <tr> 
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">检查项目</td>  
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">评价标准</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">壳体</td>  
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">无明显缩痕，无毛刺，无裂纹</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">可视面</td>  
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">无明显的气泡、夹杂物、波纹、斑点、划痕及裂痕，数字、文字及符号等均应清晰完整。无折光及读数失真现象，显露部分不应有炫目光泽及影响外观的缺陷。</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">指示灯</td>  
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">信号指示灯点亮时，组合仪表上各种指示信号、符号、图案及颜色应清晰完整，无窜光现象。当信号指示灯熄灭时信号状态应与点亮时有明显的区别，即有良好的对比度。</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">照明效果</td>  
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">能看清各种仪表的数字及文字符号，但不得有强光炫目的现象。</td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">液晶屏</td>  
                        
                        <td width="50%" valign="&#xA;            top&#xA;          ">表面清洁，不得有裂纹或形变，点亮之后不能有残影，字符要清晰</td> 
                        
                     </tr> 
                     
                  </tbody> 
                  
               </table> 
               
               
            </p> 
            
         </div>
