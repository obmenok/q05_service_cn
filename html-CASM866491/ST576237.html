         <h3 class="title topictitle1" title="ST576237">车轮跳动检查</h3>
         
         
         <div class="body"> 
            
            <p class="p">用千分表测量车轮跳动量，测量时，需拆下轮胎，在轮辋两内侧轮缘处测量径向和端向跳动。如（图示①），将千分表固定在车轮和轮胎总成旁边，缓慢转动车轮一圈并记录千分表读数，如果测量值超过如下数值，且车轮平衡也不能消除振动，则更换车轮。测量胎面中心的自由径向跳动（图示②）。可在胎面上贴一条胶带，形成光滑表面。测量最靠近胎面的轮胎外侧的自由端面跳动（图示③）。</p>
