         <h3 class="title topictitle1" title="ST594239">增值服务领取方法</h3>
         
         
         <div class="body"> 
            
            <p class="p">增值服务在实名认证通过后，系统自动赠送。实名成功后，车联网流量通信套餐系统1-2小时内自动赠送到账，含基础服务流量和增值服务流量。基础服务为远程车控/查询、在线导航、在线语音、系统升级等功能，其余为增值服务（具体以系统到账为准，可在“引力域 APP-爱车-服务-车机服务-我的”中查看），基础服务不在用户终端界面显示。</p>  
            
            <p class="p"></p>
