      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576446">检查与确认</h3>
         
         
         <div class="body"> 
            
            <p class="p">1.确认顾客的问题。</p>  
            
            <p class="p">2.目视检查是否有明显的机械或电气损坏的痕迹，是否有明显的碰撞痕迹。</p>  
            
            <p class="p"> 
               <span class="ph b">目视检查表</span> 
               
            </p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>机械部分</p> 
                        
                     </td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>电气部分</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>• 方向盘</p>  
                        
                        <p>• 喇叭</p> 
                        
                     </td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>• 线路</p>  
                        
                        <p>• 旋转连接器</p>  
                        
                        <p>• 方向盘喇叭开关</p>  
                        
                        <p>• 前域控制器BDC</p> 
                        
                     </td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
            <p class="p">3.检查易于看到或能够给看到的系统线路。</p>  
            
            <p class="p">4.如果所观察或提出的问题的明显原因已经发现，则在进行下一个步骤之前，必须先将该原因修正。</p>  
            
            <p class="p">5.如果目视检查通过，则确认故障并参考故障症状表。</p> 
            
         </div>
