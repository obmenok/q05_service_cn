         <h3 class="title topictitle1" title="ST575183">检查与确认</h3>
         
         
         <div class="body"> 
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>操作车辆使状况再现，确认顾客的问题；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>目视检查是否能发现明显的故障原因；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>如果目视检查或顾客所叙述的问题发现到明显原因，则在执行下一步骤前先将它修复（如果可能）；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>如果问题在检查后仍然存在，则确定症状并参阅症状表。</p> 
                  
               </li> 
               
            </ol> 
            
         </div>
