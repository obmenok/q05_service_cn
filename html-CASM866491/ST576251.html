      <section id="ST576251">
         
         
         
         <h3 class="title topictitle1" title="ST576251">前稳定杆总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>举升车辆，拆卸车轮。请参考： 
                     <a class="xref" href="ST576268.html">车轮和轮胎</a> 
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸前副车架总成。请参考： 
                     <a class="xref" href="ST576253.html">前副车架总成</a> 
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸左右各2颗前稳定杆托架与前副车架安装螺栓，扭矩：65 ±5N.m。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP298964.png" alt="MP298964"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>取出前稳定杆总成（包含稳定杆托架和稳定杆衬套）。</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸前稳定杆托架（稳定杆衬套与稳定杆硫化一体，不可拆卸）。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP298966.png" alt="MP298966"></img></div> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p> 
            
         </div>
