      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576705">电子控制单元</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">为了防止损坏电子控制单元，车身修理时必须遵守以下注意事项：</span> 
               
            </p>  
            
            <ul name="contents" class="ul"> 
               
               <li> 
                  
                  <p>电焊操作前，必须先断开蓄电池负极接线柱；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>切勿将电子控制单元暴露在80度以上的环境温度内，当维修环境温度可能高达80℃时，应将电子控制原件拆下；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>电子控制单元不得与焊接电极接触；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>如发生下列情况，必须更换电子控制单元：</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>控制单元外壳明显变形；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>接线端口或电路严重损坏；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>接头连接因潮湿而损坏或腐蚀。</p> 
                  
               </li> 
               
            </ul>
            
            
         </div>
         
         
         
      </section>
