         <h3 class="title topictitle1" title="ST576300">轮速传感器总成</h3>
         
         
         <div class="body"> 
            
            <p class="p">功能：主要用于汽车ABS(防抱死)系统及ESP（也称ESC,车身稳定控制）系统，用来测量汽车车轮的转速。</p>  
            
            <p class="p">工作原理：利用某些金属或半导体的电阻值随外加磁场变化而变化的现象，这一现象就是磁阻效应，在施加一定工作电压的情况下，从而输出变化的电流信号。</p>
