      <section id="TT577117">
         
         
         
         <h3 class="title topictitle1" title="TT577117">标定要求</h3>
         
         
         <div class="body"> 
            
            <p class="p">1. 选取的工位需要是水平地面；</p>  
            
            <p class="p">2. 胎压正常，做标定的时候车型不存在因为某个轮胎气压不足导致的倾斜；</p>  
            
            <p class="p">3. 方向盘回零，车轮回正；</p>  
            
            <p class="p">4. 车辆处于静止状态或车速为0；</p>  
            
            <p class="p">5. 车辆上电至 On 档状态；</p>  
            
            <p class="p">6. 控制器工作电压正常；</p>  
            
            <p class="p">7. 控制器通讯正常；</p>  
            
            <p class="p">8. 控制器无内部传感器故障。更换安全气囊控制器后需进行IMU标定。</p>  
            
            <p class="p">详细步骤请参考 
               <a class="xref" href="TT577118.html">标定步骤</a> 
               
            </p> 
            
         </div>
         
         
         
      </section>
