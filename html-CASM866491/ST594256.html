      <section id="ST594256">
         
         
         
         <h3 class="title topictitle1" title="ST594256">行车记录仪</h3>
         
         
         <div class="body"> 
            
            <p class="p">环视行车记录功能（DVR）即为汽车“黑匣子”，主要功能为通过AVM系统在车辆周围的4个摄像头，记录车辆行驶过程中车外视频信号及车辆状态信号，为交通事故提供证据。DVR通过摄像头实时采集车辆周围视频信息，通过CAN总线与BDC、EPBI、EPS等通信，实现对车辆运行状态以及相应的视频信息存储。此外，系统还应具有拍照，实时显示、回放功能。</p>
