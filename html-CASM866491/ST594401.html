                     <td width="11.764705882352942%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>车辆准备</p> 
                        
                     </td>  
                     
                     <td width="58.82352941176471%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>A：将车挪上举升机，整车下电（钥匙闭锁），水平举升车辆</p>  
                        
                        <p>B：检查是否存在漏油，如有漏油，应予以修复。</p>

                     <td width="58.82352941176471%" valign="&#xA;            top&#xA;          "> 
                        
                        <div class="imagetable"><img width="" src="image/MP416078.png" alt="MP416078"></img></div>

                        <p>B：安装放油螺塞，拧紧力矩为15Nm±3Nm。</p>
