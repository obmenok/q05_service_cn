   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576303">外观检查表</h3>
         
         
         <div class="body"> 
            
            <p class="p">集成制动控制模块外观检查主要包括如下部分：</p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">序号</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查项</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">1</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块外观是否有明显的凹痕</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">2</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块的ECU外壳是否有破损</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">3</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块的ECU接插件是否有松动</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">4</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块的线束连接线是否有脱落</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">5</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块制动油管连接接头处是否有漏油、渗油</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">6</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块与车身前壁板的安装是否有松动</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">7</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块液位传感器接插件连接是否松动可靠</td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">8</td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          ">检查集成制动控制模块油壶油位是否在正常范围内</td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
         </div>
         
         
         
      </section>
