      <section id="ST576592">
         
         
         
         <h3 class="title topictitle1" title="ST576592">拆卸和安装后门限位器总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d70140e18">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">这里介绍左侧后车门限位器的拆卸和安装，右侧后车门限位器的拆卸和安装大体可参照左侧。</p>  
                     
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p"> 
               <span class="ph b">工具</span> 
               
            </p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               
               <thead style="font-weight: bold"> 
                  
                  <tr> 
                     
                     <th width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p> 
                           <span class="ph b">名称</span> 
                           
                        </p> 
                        
                     </th>  
                     
                     <th width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p> 
                           <span class="ph b">数量</span> 
                           
                        </p> 
                        
                     </th> 
                     
                  </tr> 
                  
               </thead>  
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>10号套筒</p> 
                        
                     </td>  
                     
                     <td width="50%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>1</p> 
                        
                     </td> 
                     
                  </tr> 
                  
               </tbody> 
               
            </table> 
            
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>拆卸后车门饰板。 
                     <a class="xref" href="ST576588.html">拆卸和安装后门内饰板</a> 
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>用手小心拆除下图中“箭头”所示处防水膜。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP414218.jpg" alt="MP414218"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>使用10号套筒旋出后车门限位器（车门端）两颗固定螺栓，图中“”箭头“指示处。拧紧力矩：9±2N·m。</p>  
                  
                  <div> 
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP414219.jpg" alt="MP414219"></img></div> 
                     
                  </div> 
                  
               </li>  
               
               <li> 
                  
                  <p>使用10号套筒旋出图中箭头处后车门限位器（侧围端）固定螺栓，图中“”箭头“指示处。拧紧力矩：23±3N·m。</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP414220.jpg" alt="MP414220"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>取出后车门限位器。</p> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装大体以拆卸倒序进行。</p> 
            
         </div>
