   <body onload="custTopic()">
      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576699">拆卸与安装背门槛装饰板总成</h3>
         
         
         <div class="body"> 
            
            <div class="section">
               <h3 class="title topictitle1">拆卸</h3> 
               
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>直接取下行李箱地毯。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP424923.png" alt="P249862"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸背门框密封胶条，参见 
                        拆卸与安装背门框密封胶条 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>用十字螺丝刀拆卸三颗螺钉。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP424924.png" alt="P249863"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>用手向车上方拆卸背门槛装饰板，卡扣和自身卡脱出后，用手取出背门槛装饰板。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP424925.png" alt="P249864"></img></div> 
                     
                  </li> 
                  
               </ol> 
               
            </div>
            
            
            <div class="section">
               <h3 class="title topictitle1">安装</h3> 
               
               
               <p class="p">安装顺序与拆卸顺序相反。</p>  
               
               <div>
                  <div class="wl-attention prespace postspace" data-attention-type="caution" id="d75176e66">
                     <header>
                        <h2>注意</h2>
                     </header>
                     <div class="attention-text postspace-s wl-attention-content"> 
                        
                        <p class="p">安装前，应对每个零件进行检查，看有无变质或损坏，如发现缺陷应更换，若卡扣拆卸时留在钣金孔上，安装时需从钣金取出卡接到零件上后再装配。</p> 
                        
                     </div>
                  </div>
                  
               </div> 
               
            </div>
            
            
         </div>
