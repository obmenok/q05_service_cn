         <h3 class="title topictitle1" title="ST576328">转向不回位</h3>
         
         
         <div class="body"> 
            
            <p class="p">转向不回位或者回正性差可参照下表进行诊断及维修</p>  
            
            
            <table width="100%" border="1" frame="box" rules="all">  
               
               
               
               
               <tbody> 
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" rowspan="5" valign="&#xA;            top&#xA;          "> 
                        
                        <p>转向不回位或者回正性差</p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>EPS断电，缺失转角中位</p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>参考EPS转角标定</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>转向拉杆内/外球头摆动/转动力矩过大</p> 
                        
                     </td>  
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>更换转向器</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>前摆臂球头摆动力矩过大</p>

                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                        
                        <p>更换前下摆臂球头</p> 
                        
                     </td> 
                     
                  </tr>  
                  
                  <tr> 
                     
                     <td width="33.33333333333333%" valign="&#xA;            top&#xA;          ">

                     </td>
