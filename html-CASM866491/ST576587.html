      <section id="ST576587">
         
         
         
         <h3 class="title topictitle1" title="ST576587">拆卸和安装前车门内夹条</h3>
         
         
         <div class="body"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d70021e12">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">这里介绍的是左侧前车门内夹条的拆卸和安装，右侧前车门内夹条的拆卸和安装大体相同。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">1、将前门玻璃降到最低位置 。</p>  
            
            <p class="p">2、拆卸前门内饰板。 
               <a class="xref" href="ST576575.html">拆卸与安装前门内饰板</a> 
               
            </p>  
            
            <p class="p">3、沿箭头方向取出前车门内夹条。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP430573.jpg" alt="P131295"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装大体以拆卸倒序进行,安装的时候需要确保防水边卡到内板钣金里。</p> 
            
         </div>
         
         
         
      </section>
