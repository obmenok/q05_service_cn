      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576869">侧向毫米波雷达总成</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">1、断开蓄电池负极线束。</p>  
            
            <p class="p">参考：
               <a class="xref" href="ST576231.html">蓄电池总成</a>。
               
            </p>  
            
            <p class="p">2、拆卸后保险杠总成。</p>  
            
            <p class="p">参考：
               <a class="xref" href="ST576648.html">拆卸和安装后保险杠</a>。
               
            </p>  
            
            <p class="p">3、断开侧向毫米波雷达总成线束接头。</p>  
            
            <p class="p"> 
               
               <div> 
                  
                  <h3 class="title topictitle1"></h3>  
                  
                  <div class="imagecenter"><img width="" src="image/P330442.png" alt="P330442"></img></div> 
                  
               </div> 
               
            </p>  
            
            <p class="p">4、用手按下支架卡接定位结构，向接插件方向拔出侧向毫米波雷达总成。</p>  
            
            <p class="p"></p>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">将侧向毫米波雷达总成从支架前方卡接进入雷达支架，卡接时，直到听见“咔”的一声为止。后续安装顺序与相应拆卸顺序相反。</p> 
            
         </div>
