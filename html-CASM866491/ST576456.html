      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576456">怀挡开关雨刮控制</h3>
         
         
         <div class="body"> 
            
            <div class="imagecenter"><img width="50%" src="image/MP416664.jpg" alt="MP360243"></img></div>  
            
            <p class="p">怀档开关左侧手柄的末端为PUSH按键，可以按下2个档位</p>  
            
            <p class="p">点动：车辆上电后，将怀档开关左侧手柄末端的PUSH按键按至1档并立即释放，前雨刮将刮动1次；若将PUSH按键按至1档并保持，前雨刮将以为低速档持续刮动直到释放PUSH按键。</p>  
            
            <p class="p">洗涤：车辆上电后，将怀档开关左侧手柄末端的PUSH按键按至2档将执行洗涤功能。</p>  
            
            <p class="p">怀挡开关左侧手柄有4个前雨刮控制档位及3个后雨刮控制档位</p>  
            
            <p class="p">OFF：关闭</p>  
            
            <p class="p">INT/AUTO：间隙档位雨刮/自动感应雨刮</p>  
            
            <p class="p">LO：低速</p>  
            
            <p class="p">HI:高速</p>  
            
            <p class="p">后雨刮洗涤：后雨刮喷水，并刮刷数次</p>  
            
            <p class="p">后雨刮关闭：后雨刮关闭</p>  
            
            <p class="p">后雨刮刮刷：后雨刮间隙刮刷</p> 
            
         </div>
