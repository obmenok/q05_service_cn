      <section id="ST576607">
         
         
         
         <h3 class="title topictitle1" title="ST576607">拆卸和安装背门框密封条</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">从车身止口处取出背门密封条。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP359114.jpg" alt="MP322791"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">1、检查密封条外观是否存在破损等缺陷，有则更换零件；2、将密封条接头对接点与背门锁销对中安装；3、从对接点开始，按照顺时针或者逆时针顺序，将密封条依次卡入止口边；4、装配后检查背门框密封条完全卡入止口，无卷曲，变形，起皱外观问题。</p> 
            
         </div>
         
         
         
      </section>
