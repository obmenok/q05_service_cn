      <section id="ST576654">
         
         
         
         <h3 class="title topictitle1" title="ST576654">拆卸和安装车身下护板和前/后门外护板</h3>
         
         
         <div class="body"> 
            
            <div class="section">
               <h3 class="title topictitle1">拆卸</h3> 
               
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>向外拉前/后门外护板将其拆下；</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP428840.png" alt="MP363357"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸车身下护板前端1颗09409-10403十字推钉，后端1颗09136-48004-S355十字槽盘头自攻螺钉和平垫圈组合件；</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP428863.png" alt="MP363366"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸车身下护板底部7颗09409-10403十字推钉；</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP428864.png" alt="MP363370"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸车身下护板前先拆卸前/后轮眉；然后打开前/后车门，向外拉车身下护板外边缘将其拆下；</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP428866.png" alt="MP363371"></img></div> 
                     
                  </li> 
                  
               </ol> 
               
            </div>

               <h3 class="title topictitle1">安装</h3> 
               
               
               <p class="p">安装顺序与拆卸顺序相反。</p>
