      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576316">后制动电机</h3>
         
         
         <div class="body"> 
            
            <p class="p">1、使用诊断仪，进入：诊断仪&gt;汽车诊断&gt;IBCU集成制动控制模块&gt;特殊功能&gt;执行电子卡钳进入维修模式。进入维修模式</p>  
            
            <p class="p">2、拔下卡钳电机线束接插件。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428835.JPG" alt="P250047"></img></div>  
            
            <p class="p">3、使用5#内六角起子拆卸两颗螺钉。扭力8-13N.m</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428836.JPG" alt="P247344"></img></div>  
            
            <p class="p">安装</p>  
            
            <p class="p">安装顺序与拆卸顺序完全相反。</p>  
            
            <p class="p">使用诊断仪，退出诊断维修模式。</p>  
            
            <p class="p">重启车辆。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d49584e40">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">更换电机后必须重启车辆，否则制动系统故障灯会亮。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
