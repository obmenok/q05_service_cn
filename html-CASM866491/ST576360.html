      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576360">压缩机润滑油使用说明</h3>
         
         
         <div class="body"> 
            
            <p class="p">压缩机润滑油是空调压缩机的专用润滑油，它能保证压缩机正常运转。一定要遵照说明书中的步骤进行维修；</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d52811e15">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">压缩机润滑油的注意事项：</p>  
                     
                     <p class="p">必须严格使用原车空调压缩机所规定的压缩机润滑油牌号，禁止使用不同型号、品牌的压缩机级润滑油。</p>  
                     
                     <p class="p">压缩机润滑油吸收水分能力极强，加注或更换时，操作必须迅速，在加注完成后应立即将油罐盖子密封储存。</p>  
                     
                     <p class="p">只允许加到规定用量，不得过度加注，以免降低制冷效果。</p>  
                     
                     <p class="p">排放制冷剂时要缓慢进行，以免压缩机润滑油和制冷剂一起排出。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
