      <section id="ST576521">
         
         
         
         <h3 class="title topictitle1" title="ST576521">怀挡开关</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <div class="imagecenter"><img width="" src="image/MP416784.png" alt="P322131"></img></div>  
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>在拆卸怀档开关前，先将方向盘拆下，请参见 
                        <a class="xref" href="ST576334.html">方向盘</a> 章节 。
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆下方向盘后，用手将旋转连接器卡接在怀档开关上的3个卡扣抠开，取下旋转连接器，并拔出旋转连接器接插件。</p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>用十字启将怀挡连接的两颗螺钉拧下，取下怀档开关，并拔出怀档开关接插件。</p> 
                     
                  </li> 
                  
               </ol> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p> 
            
         </div>
