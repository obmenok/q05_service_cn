      <section id="ST576634">
         
         
         
         <h3 class="title topictitle1" title="ST576634">顶盖遮阳帘</h3>
         
         
         <div class="body"> 
            
            <div class="section">拆卸</div>
            
            
            <p class="p">1、拆卸顶盖内衬、侧气帘、拉手及拉手支架等周边零件；</p>  
            
            <p class="p">2、用螺丝刀拆下图中圆圈与方框处遮阳帘安装点，先拆卸方框内左、右与侧围连接的安装支架，再拆卸圆圈内前后框架的安装点，前后框架各剩1-2个安装点时，需1-2人从内部托举遮阳帘，待安装点全部拆卸后从背门拿出，扭力要求6±1N.m</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP428333.png" alt="MP428333"></img></div>  
            
            <div class="section">安装</div>
            
            
            <p class="p">安装顺序与拆卸顺序相反。</p>  
            
            <p class="p">注意：安装完成后，需对顶盖遮阳帘进行初始化操作。</p> 
            
         </div>
         
         
         
      </section>
