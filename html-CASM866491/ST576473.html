      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576473">喷水壶</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p"> 
               
               <ol class="num"> 
                  
                  <li> 
                     
                     <p>拆卸右前轮胎，参见 
                        <a class="xref" href="ST576268.html">车轮和轮胎</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸右前轮罩衬板，参见 
                        <a class="xref" href="ST576655.html">拆卸和安装轮罩衬板</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸机舱饰件，参见 
                        <a class="xref" href="ST580727.html">拆卸和安装机舱饰件</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>拆卸前保险杠和右前翼子板，参见 
                        <a class="xref" href="ST576647.html">拆卸和安装前保险杠</a> 和 
                        <a class="xref" href="ST576651.html">翼子板</a> 
                        
                     </p> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>喷水壶上的软管与前软管通过二通管连接，在下图箭头所示位置处将前软管拔出即可。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP296736.png" alt="P250363"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>用一字起拆下喷水壶的6颗卡扣。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP296737.png" alt="P250364"></img></div> 
                     
                  </li>  
                  
                  <li> 
                     
                     <p>用六角套筒工具拧下2颗螺栓及1颗螺母，再用内六花拧下一颗螺栓（详见如下图所示），即可取下喷水壶。</p>  
                     
                     <div class="imagecenterlevel1"><img width="50%" src="image/MP296738.jpg" alt="P250365"></img></div> 
                     
                  </li> 
                  
               </ol> 
               
            </p>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p> 
            
         </div>
