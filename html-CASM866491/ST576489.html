         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">功能介绍</span> 
               
            </p>  
            
            <p class="p">当车辆发动机未启动处于纯电行驶时，车辆前进速度在0km/h到30km/h的速度下或者处于倒车档位，发出提示音以警示车外行人。</p>  
            
            <p class="p"> 
               <span class="ph b">操作说明</span> 
               
            </p>  
            
            <p class="p">低速行车提示音扬声器在车辆每次上电时默认开启，当车辆电源档位处于ON档，进入车机车辆中心-声音界面，可通过“低速提示音”开关进行打开、关闭、音源选择操作。</p>
