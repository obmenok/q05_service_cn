      <section id="ST576568">
         
         
         
         <h3 class="title topictitle1" title="ST576568">侧碰传感器</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>拆卸座椅。</p>  
                  
                  <p>参考： 
                     <a class="xref" href="ST665129.html">前排座椅总成</a>章节
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸门槛内饰板和B柱下内饰板。</p>  
                  
                  <p>参考： 
                     <a class="xref" href="ST576695.html">拆卸与安装B柱装饰板</a>章节
                     
                  </p> 
                  
               </li>  
               
               <li> 
                  
                  <p>拆卸侧碰传感器安装螺栓</p>  
                  
                  <p>扭矩：10±1Nm</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP410642.png" alt="MP322780"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>拔掉侧碰传感器接插件。</p>  
                  
                  <p> 
                     <span class="ph b">安装</span> 
                     
                  </p>  
                  
                  <p>安装顺序与拆卸顺序相反。</p> 
                  
               </li> 
               
            </ol>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="warning" id="d69274e74">
                  <header>
                     <h2>警告</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">侧碰传感器必须轻拿轻放，装配时应注意避免磕碰、敲击、摔落。且不允许私自拆开壳体。传感器紧固后，必须检查紧固螺栓的扭力值不低于10N•m。</p>  
                     
                     <p class="p">拆除侧碰传感器之前，必须使车辆需处于下电状态。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
