         <h3 class="title topictitle1" title="ST551982">安全气囊</h3>
         
         
         <div class="body"> 
            
            <ul name="contents" class="ul"> 
               
               <li> 
                  
                  <p>若使用电焊机，首先拆卸所有安全气囊及安全带卷收器总成；</p> 
                  
               </li>  
               
               <li> 
                  
                  <p>如果有可能对“碰撞传感器”造成冲击，则需要拆下碰撞传感器。</p> 
                  
               </li> 
               
            </ul>
