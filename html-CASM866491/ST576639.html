   <body onload="custTopic()">
      <section id="ST576639">
         
         
         
         <h3 class="title topictitle1" title="ST576639">拆卸和安装前罩锁</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <ol class="num"> 
               
               <li> 
                  
                  <p>取出上装饰盖板卡扣，</p>  
                  
                  <p>取出上装饰盖板①；</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP422737.jpg" alt="MP422737"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>旋出前罩锁安装螺栓-箭头，</p>  
                  
                  <p>螺栓拧紧力矩23±3N，</p>  
                  
                  <p>拆下前罩锁③；</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP422738.jpg" alt="MP422738"></img></div> 
                  
               </li>  
               
               <li> 
                  
                  <p>脱出前罩解锁拉索②，</p>  
                  
                  <p>取出前罩锁③；</p>  
                  
                  <div class="imagecenterlevel1"><img width="50%" src="image/MP422739.jpg" alt="MP422739"></img></div> 
                  
               </li> 
               
            </ol>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装大体以倒序进行。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d72588e69">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">请务必保证前罩解锁拉索头部完全卡入前罩锁对应卡槽中。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d72588e76">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">请务必保证前罩锁安装螺栓拧紧力矩达到23±3N。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
