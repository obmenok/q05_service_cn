   <body onload="custTopic()">
      <section id="ST576608">
         
         
         
         <h3 class="title topictitle1" title="ST576608">拆卸和安装背门内饰板</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               <span class="ph b">拆卸</span> 
               
            </p>  
            
            <p class="p">1.使用塑料起子撬开并拆卸背门上装饰件。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP424899.png" alt="MP294519"></img></div>  
            
            <p class="p">2.使用十字螺丝刀将固定背门左右侧装饰件的螺钉拆下。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP424900.png" alt="MP294520"></img></div>  
            
            <p class="p">3.拆卸左右侧背门装饰件。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP424903.png" alt="MP424903"></img></div>  
            
            <p class="p">4.用十字螺丝刀拆除固定背门下装饰件两侧的固定螺钉。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP424905.png" alt="MP294527"></img></div>  
            
            <p class="p">5.用十字螺丝刀拆除背门拉手盒内部固定螺栓 
               <img src="image/MP424908.png"></img> 
               
            </p>  
            
            <p class="p">6.拆卸背门饰板。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP424909.png" alt="MP294532"></img></div>  
            
            <p class="p">7.使用一字螺丝刀撬起电动尾门开关，断开背门电动开关线束插头。拆卸背门下内饰板。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/MP361115.bmp" alt="MP294534"></img></div>  
            
            <p class="p"> 
               <span class="ph b">安装</span> 
               
            </p>  
            
            <p class="p">安装顺序与拆卸顺序相反。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d70903e71">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">背门内饰板卡扣为一次性元件，安装时需更换新的背门内饰板卡扣。</p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
