         <h3 class="title topictitle1" title="ST576429">系统概述</h3>
         
         
         <div class="body"> 
            
            <p class="p">电源插座安装在后备箱侧围，通过这个插座，可以获得12V的直流电源输出。</p>  
            
            <p class="p">前排Type-C充电接口位于点烟器面板主驾侧，仅可为移动设备充电。</p>  
            
            <p class="p">USB数据接口位于点烟器面板副驾侧，可与外接设备进行数据传输。</p>  
            
            <p class="p">后排USB充电接口位于中控箱后部面板上，仅可为移动设备充电。</p>  
            
            <p class="p">无线充电安装在中控箱前部，可为手机进行无线充电。</p> 
            
         </div>
