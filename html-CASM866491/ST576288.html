      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576288">前制动盘</h3>
         
         
         <div class="body"> 
            
            <p class="p">拆卸</p>  
            
            <p class="p">1、拆卸前制动卡钳，参考 
               <a class="xref" href="ST576286.html">前制动钳</a> 
               
            </p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d46955e22">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">可忽略拆卸制动软管。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p">2、悬挂制动钳。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d46955e31">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">将制动钳挂起，以防止拉伸制动软管。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p">3、拆卸制动盘。使用十字螺丝刀拆卸制动盘安装螺钉，扭力9-11N.m。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428468.JPG" alt="P245988"></img></div>  
            
            <p class="p">安装</p>  
            
            <p class="p">安装顺序与拆卸顺序相反。制动盘安装螺钉扭力9-11N.m。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d46955e50">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">更换制动盘时，如原车制动盘已磨损较多，在安装卡钳前，需使用活塞回顶工具将活塞顶回。 
                        <a class="xref" href="ST576287.html">前制动摩擦块</a>  
                        <a class="xref" href="ST576291.html">后制动摩擦块</a> 
                        
                     </p> 
                     
                  </div>
               </div>
               
            </div> 
            
         </div>
         
         
         
      </section>
