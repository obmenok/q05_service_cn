      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576610">规格</h3>
         
         
         <div class="body"> 
            
            <p class="p"> 
               
               
               <table width="100%" border="1" frame="box" rules="all">  
                  
                  
                  
                  
                  <tbody> 
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" rowspan="2" valign="&#xA;            top&#xA;          "> 
                           
                           <p>车窗运行时间</p> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>上升</p> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>&gt;100mm/s，2&lt;t&lt;4</p> 
                           
                        </td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>下降</p> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>&lt;220mm/s</p> 
                           
                        </td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" colspan="3" valign="&#xA;            top&#xA;          "> 
                           
                           <p> 
                              <span class="ph b">备注：</span> 
                              
                           </p>  
                           
                           <p>1、“t”为玻璃从全开到全关或从全关到全开过程的设计运动时间；</p>  
                           
                           <p>2、上升和下降最小速度不低于各自平均速度的0.9倍，即产品公差允许上下波动10%；</p> 
                           
                        </td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>声噪</p> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>背景噪声30dB，冲击和换向最高噪声小于60dB(A)</p> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>上升和下降过程中，运行最高噪声小于50dB(A)</p> 
                           
                        </td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>防夹力（仅限带防夹功能车窗）</p> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" colspan="2" valign="&#xA;            top&#xA;          "> 
                           
                           <p>防夹力：＜100N</p> 
                           
                        </td> 
                        
                     </tr>  
                     
                     <tr> 
                        
                        <td width="33.33333333333333%" valign="&#xA;            top&#xA;          "> 
                           
                           <p>防夹区域</p> 
                           
                        </td>  
                        
                        <td width="33.33333333333333%" colspan="2" valign="&#xA;            top&#xA;          "> 
                           
                           <p>距车门窗框顶端4mm～200mm的区域</p> 
                           
                        </td> 
                        
                     </tr> 
                     
                  </tbody> 
                  
               </table> 
               
               
            </p> 
            
         </div>
         
         
         
      </section>
