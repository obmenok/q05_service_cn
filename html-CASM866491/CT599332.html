   <body onload="custTopic()">
      <section id="CT074488">
         
         
         
         <h3 class="title topictitle1" title="CT599332">调整前车门</h3>
         
         
         <div class="body taskbody"> 
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d358e12">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">1、调整前车门前，车辆必须静止停放在水平地面上。</p>  
                     
                     <p class="p">2、在一名装配工的协助下进行调整。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p">1、使用13号套筒旋松（无需旋出）前车门铰链（车门处）固定螺栓，“箭头”指示处，对前车门进行调整。</p>  
            
            <p class="p">螺栓拧紧力矩：33±3N.m</p>  
            
            <p class="p"> 
               
               <div> 
                  
                  <h3 class="title topictitle1"></h3>  
                  
                  <div class="imagecenter"><img width="50%" src="image/MP419538.jpg" alt="MP260523"></img></div> 
                  
               </div> 
               
            </p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d358e38">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content"> 
                     
                     <p class="p">1、如果前车门处于关闭状态时，各处的间隙都是均匀的，没有向内或向外凸出且轮廓对齐，说明车门已经正确调整好。</p>  
                     
                     <p class="p">2、按照上述步骤，如果没有达到调整效果，可以参照下面步骤进行下一步调整。</p> 
                     
                  </div>
               </div>
               
            </div>  
            
            <p class="p">2、拆卸翼子板</p>  
            
            <p class="p">3、使用13号套筒旋松（无需旋出）前车门铰链（侧围处）固定螺栓，“箭头”指示处，对前车门1进行调整。</p>  
            
            <p class="p">螺栓拧紧力矩：33±3N.m</p>  
            
            <p class="p"> 
               
               <div> 
                  
                  <h3 class="title topictitle1"></h3>  
                  
                  <div class="imagecenter"><img width="50%" src="image/MP419564.jpg" alt="MP260524"></img></div> 
                  
               </div> 
               
            </p> 
            
         </div>
