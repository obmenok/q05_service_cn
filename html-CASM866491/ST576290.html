      <section id="topic-1-F5240221">
         
         
         
         <h3 class="title topictitle1" title="ST576290">后制动钳</h3>
         
         
         <div class="body"> 
            
            <p class="p">拆卸</p>  
            
            <p class="p">1、拆卸EPB线束。按下接插件拔出。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428573.JPG" alt="MP299231"></img></div>  
            
            <p class="p">2、从制动钳上拆卸下制动软管。扭矩：30±2N.m。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428574.JPG" alt="MP299233"></img></div>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d47124e28">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">封住制动软管，防止油液流失和脏物进入。</div>
               </div>
               
            </div>  
            
            <p class="p">3、拆卸卡钳支架连接螺栓，取下制动钳。扭矩：120±10N.m。</p>  
            
            <div class="imagecenter"><img width="50%" src="image/P428575.JPG" alt="P250048"></img></div>  
            
            <p class="p">安装</p>  
            
            <p class="p">1、安装顺序与拆卸顺序相反。</p>  
            
            <div>
               <div class="wl-attention prespace postspace" data-attention-type="caution" id="d47124e43">
                  <header>
                     <h2>注意</h2>
                  </header>
                  <div class="attention-text postspace-s wl-attention-content">卡钳安装螺栓为一次性使用件，不可重复使用。</div>
               </div>
               
            </div>  
            
            <p class="p">2、制动系统排气。 
               <a class="xref" href="ST576280.html">制动系统排气</a> 
               
            </p> 
            
         </div>
