         <h3 class="title topictitle1" title="ST576214">系统功能原理介绍</h3>
         
         
         <div class="body"> 
            
            <p class="p">传动系统采用前置前驱的方式，差速器位于电驱总成内部。驱动轴将动力从差速器传递到车轮总成。每个驱动轴均包含与轴杆连接的内等速万向节和外等速万向节。内等速万向节是完全挠性的，能轴向伸缩。外等速万向节也是挠性的，但不能轴向伸缩。左右驱动轴的内端都有一个外花键，通过花键端部的差动弹簧挡圈与差速器齿轮互锁；左右驱动轴的外端通过外花键制动器连接，并用锁紧螺母紧固。</p> 
            
         </div>
